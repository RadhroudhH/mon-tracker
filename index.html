            // ============ HELPERS ============
            function catInfo(name) {
                return allCategories().find((c) => c.name === name) || { name, label: name, glyph: "·", color: "#6B6E68" };
            }

            function isThisMonth(iso) {
                if (!iso) return false;
                const d = new Date(iso);
                const now = new Date();
                return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
            }

            // Random, collision-proof ids for new rows (several users share the same tables)
            function newId(prefix) {
                if (crypto.randomUUID) return prefix + crypto.randomUUID();
                const b = crypto.getRandomValues(new Uint8Array(16));
                return prefix + Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
            }

            // Is a "YYYY-MM-DD" date inside the chosen breakdown period?
            // "3m" = the current month plus the two before it. Undated entries only count in "all".
            function inPeriod(iso, period) {
                if (period === "all") return true;
                if (!iso) return false;
                const [y, m] = iso.split("-").map(Number);
                const now = new Date();
                const monthsAgo = (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
                if (period === "month") return monthsAgo === 0;
                if (period === "3m") return monthsAgo >= 0 && monthsAgo <= 2;
                if (period === "year") return y === now.getFullYear();
                return true;
            }

            const catLabel = (name) => catInfo(name).label;

            // Built-in categories + the user's own ones. A custom category is stored in
            // expenses by its id, so renaming it later keeps every expense attached.
            function allCategories() {
                return [...CATEGORIES.map((c) => ({ ...c, color: prefs.catColors[c.name] || c.color })), ...state.categories.map((c) => ({ name: c.id, label: c.name, glyph: c.glyph, color: c.color, custom: true }))];
            }
            let featuresReady = true; // false until supabase/004_categories_goals.sql has been run
            let cardCatReady = false; // true once supabase/006_card_categories.sql has added carte.category
            const isWithdrawal = (d) => d.category === "Epargne" && d.amount < 0;

            function dayLabel(iso) {
                if (!iso) return "No date";
                const d = new Date(iso);
                if (isNaN(d)) return iso;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const target = new Date(d);
                target.setHours(0, 0, 0, 0);
                const diff = Math.round((today - target) / 86400000);
                if (diff === 0) return "Today";
                if (diff === 1) return "Yesterday";
                if (diff < 7) return d.toLocaleDateString("en-US", { weekday: "long" });
                return d.toLocaleDateString("en-US", { day: "numeric", month: "long" });
            }

            function groupByDay(items) {
                const g = {};
                items.forEach((it) => {
                    const d = it.date || "";
                    if (!g[d]) g[d] = [];
                    g[d].push(it);
                });
                return Object.keys(g)
                    .sort((a, b) => b.localeCompare(a))
                    .map((d) => ({ date: d, items: g[d] }));
            }

            function animateNumber(el, from, to, duration = 700) {
                const start = performance.now();

                function step(now) {
                    const t = Math.min(1, (now - start) / duration);
                    const eased = 1 - Math.pow(1 - t, 3);
                    const val = from + (to - from) * eased;
                    el.textContent = fmt(val);
                    if (t < 1) requestAnimationFrame(step);
                    else el.textContent = fmt(to);
                }
                requestAnimationFrame(step);
            }

            // ============ NAVIGATION ============
            document.querySelectorAll(".tab").forEach((t) => {
                t.addEventListener("click", () => {
                    vibrate(35);
                    showPage(t.dataset.page);
                });
            });

            function showPage(name) {
                if (name === currentPage) return;
                currentPage = name;
                document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
                const pageEl = document.getElementById("page-" + name);
                if (pageEl) pageEl.classList.add("active");
                document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.page === name));
                document.getElementById("page-title").textContent = TAB_TITLES[name] || name;
                document.getElementById("fab-wrap").style.display = name === "settings" ? "none" : "block";
                if (name !== "dashboard" && dashEditing) {
                    dashEditing = false;
                    savePrefs();
                }
                updateEditBtn();
                render();
                pageIn(name);
                hideSwipeArrows();
            }

            // ============ RENDER ============
            function render() {
                if (currentPage === "dashboard") renderDashboard();
                else if (currentPage === "depenses") renderDepenses();
                else if (currentPage === "revenus") renderRevenus();
                else if (currentPage === "carte") renderCarte();
                else if (currentPage === "settings") renderSettings();
            }

            // ============ PREFERENCES & THEME ============
            // Fixed palette used for card colors and category colors (no free color wheel)
            const PALETTE = ["#C4A85C", "#E8CE84", "#D9954A", "#D97558", "#E06C8A", "#D987B8", "#9B87BE", "#7C8CE0", "#5FA8C9", "#4FB3A9", "#6DB89B", "#9CC26B", "#A6A79E", "#E9E7DE"];

            // Background themes: every neutral of the interface
            const BG_THEMES = {
                forest: { label: "Forest", bg: "#0a0e0c", bg2: "#101512", surface: "#171d19", surface2: "#1f2622", border: "#262e29", borderLift: "#303934" },
                graphite: { label: "Graphite", bg: "#0c0c0d", bg2: "#121214", surface: "#1a1a1d", surface2: "#222226", border: "#2a2a2f", borderLift: "#35353b" },
                midnight: { label: "Midnight", bg: "#080b12", bg2: "#0d1220", surface: "#141b2b", surface2: "#1b2336", border: "#232d44", borderLift: "#2e3a55" },
                ocean: { label: "Ocean", bg: "#071012", bg2: "#0b181b", surface: "#112226", surface2: "#172b30", border: "#1f363c", borderLift: "#29444b" },
                plum: { label: "Plum", bg: "#0f0a10", bg2: "#160f18", surface: "#1f1622", surface2: "#281d2c", border: "#322536", borderLift: "#3e2f43" },
                espresso: { label: "Espresso", bg: "#0f0c09", bg2: "#16120e", surface: "#1f1914", surface2: "#28201a", border: "#332a22", borderLift: "#40352b" },
            };

            // Secondary (accent) colors: buttons, highlights, progress bars
            const ACCENTS = {
                gold: { label: "Gold", a: "#c4a85c", a2: "#e8ce84", dim: "#7a6a3a" },
                coral: { label: "Coral", a: "#e07a5f", a2: "#f2a48e", dim: "#7d4535" },
                rose: { label: "Rose", a: "#d9739a", a2: "#f0a3c0", dim: "#7a4157" },
                lavender: { label: "Lavender", a: "#9b87be", a2: "#c4b5e0", dim: "#584c6e" },
                sky: { label: "Sky", a: "#5fa8c9", a2: "#9ccfe6", dim: "#36607a" },
                teal: { label: "Teal", a: "#4fb3a9", a2: "#8fd9d0", dim: "#2d6560" },
                lime: { label: "Lime", a: "#9cc26b", a2: "#c6e19f", dim: "#58703b" },
            };

            const DASH_SECTIONS = { hero: "Total balance", balances: "Cash, cards & savings", breakdown: "Spending breakdown", goals: "Goals", insights: "What I notice" };
            const DEFAULT_PREFS = () => ({ layout: Object.keys(DASH_SECTIONS), hidden: [], tiles: [], theme: { bg: "forest", accent: "gold" }, catColors: {}, greeting: true, transition: true });
            const PREFS_CACHE = "carnet-prefs";
            let prefs = DEFAULT_PREFS();
            let prefsReady = false; // false until supabase/005_card_colors_prefs.sql has been run
            let dashEditing = false;

            const isColor = (c) => typeof c === "string" && /^#[0-9A-Fa-f]{6}$/.test(c);

            // Accept only known values, so a broken or old preferences object never breaks the app
            function normalizePrefs(p) {
                const d = DEFAULT_PREFS();
                if (!p || typeof p !== "object") return d;
                const layout = (Array.isArray(p.layout) ? p.layout : []).filter((id, i, a) => DASH_SECTIONS[id] && a.indexOf(id) === i);
                Object.keys(DASH_SECTIONS).forEach((id) => layout.includes(id) || layout.push(id));
                const catColors = {};
                Object.entries(p.catColors || {}).forEach(([k, v]) => isColor(v) && (catColors[k] = v));
                return {
                    layout,
                    hidden: (Array.isArray(p.hidden) ? p.hidden : []).filter((id) => DASH_SECTIONS[id]),
                    tiles: (Array.isArray(p.tiles) ? p.tiles : []).filter((k) => typeof k === "string").slice(0, 100),
                    theme: { bg: BG_THEMES[p.theme?.bg] ? p.theme.bg : d.theme.bg, accent: ACCENTS[p.theme?.accent] ? p.theme.accent : d.theme.accent },
                    catColors,
                    greeting: p.greeting !== false,
                    transition: p.transition !== false,
                };
            }

            function applyTheme() {
                const bg = BG_THEMES[prefs.theme.bg] || BG_THEMES.forest;
                const ac = ACCENTS[prefs.theme.accent] || ACCENTS.gold;
                const s = document.documentElement.style;
                s.setProperty("--bg", bg.bg);
                s.setProperty("--bg-2", bg.bg2);
                s.setProperty("--surface", bg.surface);
                s.setProperty("--surface-2", bg.surface2);
                s.setProperty("--border", bg.border);
                s.setProperty("--border-lift", bg.borderLift);
                s.setProperty("--accent", ac.a);
                s.setProperty("--accent-2", ac.a2);
                s.setProperty("--accent-dim", ac.dim);
                document.querySelector('meta[name="theme-color"]')?.setAttribute("content", bg.bg);
            }

            function loadCachedPrefs() {
                try {
                    prefs = normalizePrefs(JSON.parse(localStorage.getItem(PREFS_CACHE) || "null"));
                } catch (_) {}
                applyTheme();
            }

            let prefsTimer = null;
            function savePrefs() {
                try {
                    localStorage.setItem(PREFS_CACHE, JSON.stringify(prefs));
                } catch (_) {}
                if (!prefsReady || !currentUser) return;
                clearTimeout(prefsTimer);
                prefsTimer = setTimeout(async () => {
                    const { error } = await sb.from("prefs").upsert({ user_id: currentUser.id, data: prefs, updated_at: new Date().toISOString() });
                    if (error) toast("Could not save your layout: " + error.message, true);
                }, 500);
            }

            // ----- Dashboard editing (pen icon) -----
            function toggleDashEdit() {
                vibrate(35);
                if (currentPage !== "dashboard") {
                    showPage("dashboard");
                    return toggleDashEdit();
                }
                dashEditing = !dashEditing;
                if (!dashEditing) savePrefs();
                updateEditBtn();
                renderDashboard();
            }

            // Pen button at the right end of the tab bar: only on the Overview tab
            function updateEditBtn() {
                const b = document.getElementById("dash-edit-btn");
                if (!b) return;
                b.style.visibility = currentPage === "dashboard" ? "visible" : "hidden";
                b.classList.toggle("active", dashEditing);
            }

            function moveSection(id, delta) {
                vibrate(25);
                const l = prefs.layout;
                const i = l.indexOf(id),
                    j = i + delta;
                if (i < 0 || j < 0 || j >= l.length) return;
                [l[i], l[j]] = [l[j], l[i]];
                renderDashboard();
            }

            function toggleSection(id) {
                vibrate(25);
                prefs.hidden = prefs.hidden.includes(id) ? prefs.hidden.filter((x) => x !== id) : [...prefs.hidden, id];
                renderDashboard();
            }

            function resetDashboard() {
                if (!confirm("Reset the dashboard to the default order?")) return;
                const d = DEFAULT_PREFS();
                prefs.layout = d.layout;
                prefs.hidden = [];
                prefs.tiles = [];
                renderDashboard();
            }

            // Balance tiles: "cash", "savings" and "card:<id>", in the user's order
            function orderedTiles(bal) {
                const keys = ["cash", ...bal.cards.map((c) => "card:" + c.id), "savings"];
                const pos = (k) => {
                    const i = prefs.tiles.indexOf(k);
                    return i < 0 ? 1000 + keys.indexOf(k) : i;
                };
                return keys.sort((a, b) => pos(a) - pos(b));
            }

            function moveTile(key, delta) {
                vibrate(25);
                const order = orderedTiles(computeBalances());
                const i = order.indexOf(key),
                    j = i + delta;
                if (i < 0 || j < 0 || j >= order.length) return;
                [order[i], order[j]] = [order[j], order[i]];
                prefs.tiles = order;
                renderDashboard();
            }

            // ----- Appearance settings -----
            function setThemePart(part, value) {
                vibrate(25);
                prefs.theme[part] = value;
                applyTheme();
                savePrefs();
                renderSettings();
            }

            async function setCategoryColorPref(name, color) {
                vibrate(25);
                const custom = state.categories.find((c) => c.id === name);
                if (custom) {
                    custom.color = color;
                    renderSettings();
                    const { error } = await sb.from("categories").update({ color }).eq("id", custom.id).eq("user_id", currentUser.id);
                    if (error) toast("Could not save color: " + error.message, true);
                    return;
                }
                prefs.catColors[name] = color;
                savePrefs();
                renderSettings();
            }

            function resetAppearance() {
                if (!confirm("Reset colors to the default theme?")) return;
                prefs.theme = DEFAULT_PREFS().theme;
                prefs.catColors = {};
                applyTheme();
                savePrefs();
                renderSettings();
            }

            function swatchRow(colors, current, onPick) {
                return `<div class="swatches small">${colors
                    .map((c) => `<button type="button" class="swatch ${c.toLowerCase() === (current || "").toLowerCase() ? "active" : ""}" style="background:${c}" aria-label="Color ${c}" onclick="${onPick(c)}"></button>`)
                    .join("")}</div>`;
            }

            function appearanceSettingsHTML() {
                const bgOpts = Object.entries(BG_THEMES)
                    .map(
                        ([id, t]) => `
                    <button type="button" class="theme-opt ${prefs.theme.bg === id ? "active" : ""}" onclick="setThemePart('bg','${id}')" style="background:${t.bg};border-color:${prefs.theme.bg === id ? "var(--accent)" : t.borderLift}">
                        <span class="theme-chip" style="background:${t.surface};border-color:${t.border}"></span>${t.label}
                    </button>`,
                    )
                    .join("");
                const acOpts = Object.entries(ACCENTS)
                    .map(([id, a]) => `<button type="button" class="swatch ${prefs.theme.accent === id ? "active" : ""}" style="background:linear-gradient(145deg, ${a.a2}, ${a.a})" title="${a.label}" aria-label="${a.label}" onclick="setThemePart('accent','${id}')"></button>`)
                    .join("");
                const catRows = allCategories()
                    .map(
                        (c) => `
                    <div class="cat-color-row">
                        <div class="cat-color-name"><span class="cat-icon" style="background:${c.color}20;color:${c.color};width:28px;height:28px;font-size:13px">${escapeHtml(c.glyph)}</span>${escapeHtml(c.label)}</div>
                        ${swatchRow(PALETTE, c.color, (col) => `setCategoryColorPref('${escapeHtml(c.name)}','${col}')`)}
                    </div>`,
                    )
                    .join("");
                return `
                    <div class="section-eyebrow">Appearance</div>
                    <div class="setting-block">
                        <div class="info-label">Background</div>
                        <div class="theme-grid">${bgOpts}</div>
                    </div>
                    <div class="setting-block">
                        <div class="info-label">Secondary color</div>
                        <div class="info-sub" style="margin-bottom:10px">Buttons, highlights and progress bars</div>
                        <div class="swatches">${acOpts}</div>
                    </div>
                    <details class="setting-block">
                        <summary class="info-label">Category colors</summary>
                        <div style="margin-top:12px">${catRows}</div>
                    </details>
                    <button class="setting-row" onclick="resetAppearance()">
                        <div class="info"><div class="info-label">Reset colors</div></div>
                        <span class="arrow">↺</span>
                    </button>`;
            }

            // ============ DASHBOARD ============
            function cardBalance(card) {
                const ops = state.carte.filter((c) => c.card === card);
                const plus = ops.filter((c) => c.type === "Rechargement" || c.type === "Remboursement").reduce((s, c) => s + c.total_dt, 0);
                const minus = ops.filter((c) => c.type === "Achat").reduce((s, c) => s + c.total_dt, 0);
                return plus - minus;
            }

            // Savings balance = deposits (positive "Epargne" rows) minus withdrawals (negative ones)
            function savingsBalance(excludeId) {
                return state.depenses.filter((d) => d.category === "Epargne" && d.id !== excludeId).reduce((s, d) => s + d.amount, 0);
            }

            function computeBalances() {
                // Balances include offsets
                const totalIncome = state.revenus.reduce((s, r) => s + r.amount, 0);
                const totalExpenses = state.depenses.reduce((s, d) => s + d.amount, 0);
                const cash = totalIncome - totalExpenses;
                // every card the user has, plus any card id still referenced by an operation
                const ids = [...new Set([...state.cards.map((c) => c.id), ...state.carte.map((c) => c.card).filter(Boolean)])];
                const cards = ids.map((id) => ({ id, name: cardName(id), style: findCard(id)?.style || "default", balance: cardBalance(id) }));
                const cardsTotal = cards.reduce((s, c) => s + c.balance, 0);
                return { cash, cards, savings: savingsBalance(), total: cash + cardsTotal };
            }

            function renderDashboard() {
                const now = new Date();
                const monthName = MONTH_NAMES[now.getMonth()];
                const bal = computeBalances();

                // Stats exclude offsets and savings movements
                const spending = state.depenses.filter((d) => d.category !== "Offset" && d.category !== "Epargne");
                const thisMonth = spending.filter((d) => isThisMonth(d.date));
                const monthTotal = thisMonth.reduce((s, d) => s + d.amount, 0);
                const daysActive = new Set(thisMonth.map((d) => d.date)).size;
                const avgDay = daysActive ? monthTotal / daysActive : 0;

                const allCatTotals = {};
                spending.forEach((d) => (allCatTotals[d.category] = (allCatTotals[d.category] || 0) + d.amount));

                // ----- Balance tiles (cash, each card, savings), in the user's order -----
                const tileOrder = orderedTiles(bal);
                const tileHTML = (key, idx) => {
                    let label, sub, icon, color, valueId, click;
                    if (key === "cash") [label, sub, icon, color, valueId] = ["Cash", "In hand", "💰", "var(--success)", "solde-cash"];
                    else if (key === "savings") [label, sub, icon, color, valueId] = ["Savings", "Current balance", "✦", "var(--accent)", "solde-epargne"];
                    else {
                        const c = bal.cards.find((x) => "card:" + x.id === key);
                        if (!c) return "";
                        [label, sub, icon, color, valueId] = [c.name, "Card", "💳", cardColor(findCard(c.id) || c), "solde-card-" + bal.cards.indexOf(c)];
                        click = `state.activeCard='${escapeHtml(c.id)}';showPage('carte')`;
                    }
                    const tools = dashEditing
                        ? `<div class="tile-tools">
                            <button onclick="moveTile('${escapeHtml(key)}',-1)" ${idx === 0 ? "disabled" : ""} aria-label="Move left">‹</button>
                            <button onclick="moveTile('${escapeHtml(key)}',1)" ${idx === tileOrder.length - 1 ? "disabled" : ""} aria-label="Move right">›</button>
                          </div>`
                        : "";
                    return `
                        <div class="solde-card" ${!dashEditing && click ? `onclick="${click}" style="cursor:pointer"` : ""}>
                            <div class="icon">${icon}</div>
                            <div class="label">${escapeHtml(label)}</div>
                            <div class="value" style="color:${color}"><span id="${valueId}">0.00</span><span class="unit">DT</span></div>
                            <div class="sub">${sub}</div>
                            ${tools}
                        </div>`;
                };

                // ----- Each dashboard section -----
                const sections = {
                    hero: `
                    <div class="hero-card">
                        <div class="hero-label">Total balance</div>
                        <div class="hero-value"><span id="hero-total">0.00</span><span class="unit">DT</span></div>
                        <div class="hero-sub">
                            Spent in ${monthName}: ${fmt(monthTotal)} DT <span class="sep">·</span> ${fmt(avgDay)} DT/day
                        </div>
                    </div>`,
                    balances: `<div class="soldes-grid">${tileOrder.map(tileHTML).join("")}</div>`,
                    breakdown: `
                    <div class="section-head">
                        <div class="section-title">Spending breakdown</div>
                        <select class="period-select" id="period-select" aria-label="Breakdown period">
                            ${PERIODS.map((pr) => `<option value="${pr.id}" ${pr.id === breakdownPeriod ? "selected" : ""}>${pr.label}</option>`).join("")}
                        </select>
                    </div>
                    <div class="repart" id="breakdown"></div>`,
                    goals: featuresReady
                        ? `
                    <div class="section-head">
                        <div class="section-title">Goals</div>
                        ${state.goals.length && !dashEditing ? `<button class="small-btn" onclick="openGoalEditor()">+ Add goal</button>` : ""}
                    </div>
                    <div id="goals"></div>`
                        : "",
                    insights: `
                    <div class="section-title">What I notice</div>
                    <div id="insights"></div>`,
                };

                const visible = prefs.layout.filter((id) => sections[id] && (dashEditing || !prefs.hidden.includes(id)));
                const body = visible
                    .map((id, i) => {
                        const hidden = prefs.hidden.includes(id);
                        const tools = dashEditing
                            ? `<div class="sec-tools">
                                <span class="sec-name">${DASH_SECTIONS[id]}</span>
                                <button onclick="moveSection('${id}',-1)" ${i === 0 ? "disabled" : ""} aria-label="Move up">↑</button>
                                <button onclick="moveSection('${id}',1)" ${i === visible.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button>
                                <button onclick="toggleSection('${id}')" class="sec-hide">${hidden ? "Show" : "Hide"}</button>
                              </div>`
                            : "";
                        return `<section class="dash-sec ${dashEditing ? "editing" : ""} ${hidden ? "is-hidden" : ""}" data-sec="${id}">${tools}${sections[id]}</section>`;
                    })
                    .join("");

                const top = dashEditing
                    ? `<div class="dash-top editing">
                        <span class="dash-hint">Move sections with ↑ ↓, tiles with ‹ ›</span>
                        <button class="small-btn" onclick="resetDashboard()">Reset</button>
                        <button class="small-btn primary" onclick="toggleDashEdit()">Done</button>
                      </div>`
                    : "";

                const p = document.getElementById("page-dashboard");
                p.innerHTML = top + body;

                const anim = (id, v) => {
                    const el = document.getElementById(id);
                    if (el) animateNumber(el, 0, v);
                };
                anim("hero-total", bal.total);
                anim("solde-cash", bal.cash);
                bal.cards.forEach((c, i) => anim("solde-card-" + i, c.balance));
                anim("solde-epargne", bal.savings);
                renderGoals();

                const periodSel = document.getElementById("period-select");
                if (periodSel) {
                    periodSel.onchange = (e) => {
                        vibrate(30);
                        breakdownPeriod = e.target.value;
                        try {
                            localStorage.setItem(PERIOD_KEY, breakdownPeriod);
                        } catch (_) {}
                        renderBreakdown();
                    };
                    renderBreakdown();
                }

                // Insights: neutral, about the user's own numbers only
                const ins = document.getElementById("insights");
                if (!ins) return;
                const insights = [];
                if (avgDay > 20) insights.push({ type: "bad", text: `You spend ${fmt(avgDay)} DT/day on average this month. At that pace it's about ${fmtInt(avgDay * 30)} DT a month.` });
                else if (avgDay > 15) insights.push({ type: "warn", text: `Around ${fmt(avgDay)} DT/day. Skipping a couple of small purchases a week would make a real difference.` });
                else if (avgDay > 0 && avgDay <= 10) insights.push({ type: "good", text: `Under 10 DT/day on average. Well kept.` });
                const delivery = allCatTotals["Livraison"] || 0;
                const food = allCatTotals["Bouffe"] || 0;
                if (delivery > food * 2 && delivery > 60) insights.push({ type: "warn", text: `Delivery costs more than twice your in-store food. It's the easiest place to save.` });
                if (bal.savings >= 100) insights.push({ type: "good", text: `${fmt(bal.savings)} DT set aside so far. The momentum is there.` });
                else if (bal.savings < 30) insights.push({ type: "warn", text: `Savings are still low. A simple habit: put a little aside every time money comes in.` });
                if (!insights.length) insights.push({ type: "good", text: `Nothing special to report for now. Keep tracking.` });
                insights.forEach((i, idx) => {
                    const div = document.createElement("div");
                    div.className = "insight " + i.type;
                    div.style.animationDelay = idx * 0.08 + 0.2 + "s";
                    div.innerHTML = `<span class="icon">${i.type === "good" ? "✓" : i.type === "bad" ? "!" : "·"}</span><span>${i.text}</span>`;
                    ins.appendChild(div);
                });
            }

            // ----- Spending breakdown: three graphs (Overall, Cash, Cards) -----
            const BREAKDOWN_VIEWS = [
                { id: "overall", label: "Overall" },
                { id: "cash", label: "Cash" },
                { id: "cards", label: "Cards" },
            ];
            let breakdownView = "overall";
            let breakdownCard = "all"; // "all" or a card id (Cards view)
            try {
                const v = localStorage.getItem("carnet-breakdown-view");
                if (BREAKDOWN_VIEWS.some((x) => x.id === v)) breakdownView = v;
            } catch (_) {}

            // Spending items as { category, amount, date }. Offsets and savings moves are not spending.
            function cashSpending() {
                return state.depenses.filter((d) => d.category !== "Offset" && d.category !== "Epargne").map((d) => ({ category: d.category, amount: d.amount, date: d.date }));
            }
            function cardSpending(cardId) {
                return state.carte
                    .filter((c) => c.type === "Achat" && (cardId === "all" || c.card === cardId))
                    .map((c) => ({ category: c.category || "Autre", amount: c.total_dt, date: c.date }))
                    .filter((x) => x.category !== "Offset" && x.category !== "Epargne");
            }

            function setBreakdownView(view) {
                vibrate(25);
                breakdownView = view;
                try {
                    localStorage.setItem("carnet-breakdown-view", view);
                } catch (_) {}
                renderBreakdown();
            }

            // Change the period from inside the graph (keeps the dropdown in sync)
            function setBreakdownPeriod(period) {
                vibrate(25);
                breakdownPeriod = period;
                try {
                    localStorage.setItem(PERIOD_KEY, period);
                } catch (_) {}
                const sel = document.getElementById("period-select");
                if (sel) sel.value = period;
                renderBreakdown();
            }

            function setBreakdownCard(id) {
                vibrate(25);
                breakdownCard = id;
                renderBreakdown();
            }

            // Donut chart + list of spending per category for the selected view and period
            function renderBreakdown() {
                const el = document.getElementById("breakdown");
                if (!el) return;
                if (breakdownCard !== "all" && !findCard(breakdownCard)) breakdownCard = "all";

                const items = breakdownView === "cash" ? cashSpending() : breakdownView === "cards" ? cardSpending(breakdownCard) : [...cashSpending(), ...cardSpending("all")];
                const totals = {};
                const inRange = items.filter((d) => inPeriod(d.date, breakdownPeriod));
                inRange.forEach((d) => (totals[d.category] = (totals[d.category] || 0) + d.amount));
                // Say clearly when the period hides entries, so nothing looks "missing"
                const periodLabel = (PERIODS.find((p) => p.id === breakdownPeriod) || {}).label || "";
                const hiddenCount = items.length - inRange.length;
                const note =
                    hiddenCount > 0
                        ? `<div class="breakdown-note">${escapeHtml(periodLabel)} · ${inRange.length} of ${items.length} entries. <button type="button" onclick="setBreakdownPeriod('all')">Show all time</button></div>`
                        : "";
                const entries = Object.entries(totals)
                    .filter(([, amt]) => amt > 0)
                    .sort((a, b) => b[1] - a[1]);
                const total = entries.reduce((s, e) => s + e[1], 0);

                const views = `<div class="seg-toggle three breakdown-views">${BREAKDOWN_VIEWS.map((v) => `<button type="button" class="${v.id === breakdownView ? "active" : ""}" onclick="setBreakdownView('${v.id}')">${v.label}</button>`).join("")}</div>`;
                const cardChips =
                    breakdownView === "cards" && state.cards.length > 1
                        ? `<div class="filter-scroll breakdown-cards">${[{ id: "all", name: "All cards" }, ...state.cards]
                              .map((c) => `<button class="filter-chip ${c.id === breakdownCard ? "active" : ""}" onclick="setBreakdownCard('${escapeHtml(c.id)}')">${escapeHtml(c.name)}</button>`)
                              .join("")}</div>`
                        : "";
                const caption = breakdownView === "cash" ? "DT in cash" : breakdownView === "cards" ? (breakdownCard === "all" ? "DT on cards" : "DT on " + escapeHtml(cardName(breakdownCard))) : "DT spent";

                if (!entries.length) {
                    const why = breakdownView === "cards" && !state.carte.some((c) => c.type === "Achat") ? "No card purchases yet" : "No spending in this period";
                    el.innerHTML = views + cardChips + note + `<div style="color:var(--text-4);padding:28px 0 20px;text-align:center;font-size:12px;">${why}</div>`;
                    return;
                }

                const r = 70;
                const C = 2 * Math.PI * r;
                const gap = entries.length > 1 ? 2 : 0;
                let offset = 0;
                const segs = entries
                    .map(([cat, amt], i) => {
                        const len = (amt / total) * C;
                        const visible = Math.max(0.5, len - gap);
                        const s = `<circle class="donut-seg" cx="90" cy="90" r="${r}" stroke="${catInfo(cat).color}" stroke-dasharray="${visible} ${C - visible}" stroke-dashoffset="${-offset}" style="animation-delay:${i * 0.06}s"><title>${escapeHtml(catLabel(cat))}: ${fmt(amt)} DT</title></circle>`;
                        offset += len;
                        return s;
                    })
                    .join("");

                el.innerHTML = `
                    ${views}
                    ${cardChips}
                    ${note}
                    <div class="donut-wrap">
                        <svg viewBox="0 0 180 180" role="img" aria-label="Spending by category">
                            <circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--bg-2)" stroke-width="18" />
                            ${segs}
                        </svg>
                        <div class="donut-center">
                            <div class="total">${fmt(total)}</div>
                            <div class="caption">${caption}</div>
                        </div>
                    </div>
                    <div class="repart-list">
                        ${entries
                            .map(([cat, amt]) => {
                                const info = catInfo(cat);
                                return `
                            <div class="repart-row">
                                <div class="dot" style="background:${info.color}"></div>
                                <div class="name">${escapeHtml(info.label)}</div>
                                <div class="amt">${fmt(amt)} <span style="color:var(--text-3);font-weight:400">DT</span></div>
                                <div class="pct">${((amt / total) * 100).toFixed(0)}%</div>
                            </div>`;
                            })
                            .join("")}
                    </div>
                `;
            }

            // ============ LISTS ============
            function renderDepenses() {
                const p = document.getElementById("page-depenses");
                const chips = ["All", ...allCategories().map((c) => c.name)];
                const filtered = currentFilter === "All" ? state.depenses : state.depenses.filter((d) => d.category === currentFilter);
                p.innerHTML = `
                    <div class="filter-scroll dep-filters"></div>
                    <div class="dep-list"></div>
                `;
                const fEl = p.querySelector(".dep-filters");
                chips.forEach((c) => {
                    const btn = document.createElement("button");
                    btn.className = "filter-chip" + (currentFilter === c ? " active" : "");
                    btn.textContent = c === "All" ? "All" : catLabel(c);
                    btn.onclick = () => {
                        vibrate(35);
                        currentFilter = c;
                        renderDepenses();
                    };
                    fEl.appendChild(btn);
                });
                renderListInto(p.querySelector(".dep-list"), filtered, "depense");
            }

            function renderRevenus() {
                const p = document.getElementById("page-revenus");
                p.innerHTML = '<div class="rev-list"></div>';
                renderListInto(p.querySelector(".rev-list"), state.revenus, "revenu");
            }

            // ============ CARDS ============
            // Look of each card style. "custom" uses the image the user uploaded.
            const CARD_STYLES = {
                default: { label: "Carnet", color: "#C4A85C", gradient: "linear-gradient(160deg, #1d1a12 0%, #0f110e 100%)", border: "#2f2a1c" },
                techno: { label: "Technologique", img: "images/techno.png", color: "#9B87BE", gradient: "linear-gradient(160deg, #1D1425 0%, #10131C 100%)", border: "#2A2035" },
                d17: { label: "D17", img: "images/d17.png", color: "#6DB89B", gradient: "linear-gradient(160deg, #1A2419 0%, #0F1913 100%)", border: "#1F3025" },
                custom: { label: "My image", color: "#C4A85C", gradient: "linear-gradient(160deg, var(--surface) 0%, var(--bg-2) 100%)", border: "var(--border)" },
            };

            const findCard = (id) => state.cards.find((c) => c.id === id);
            const cardName = (id) => findCard(id)?.name || id || "—";
            // The card's chosen color, or the default color of its look
            const cardColor = (card) => (card && isColor(card.color) ? card.color : (CARD_STYLES[card?.style] || CARD_STYLES.default).color);

            // The picture of a card: preset image, uploaded image, or the default dark Carnet card
            function cardFace(card) {
                const st = CARD_STYLES[card.style] || CARD_STYLES.default;
                const src = card.style === "custom" ? card.image : st.img;
                if (src) return `<img src="${escapeHtml(src)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-default',innerHTML:'<img src=&quot;images/logo.png&quot; alt=&quot;&quot;>'}))">`;
                return `<div class="card-default named"><img src="images/logo.png" alt=""><span>${escapeHtml(card.name)}</span></div>`;
            }

            function renderCarte() {
                const p = document.getElementById("page-carte");
                if (!findCard(state.activeCard)) state.activeCard = state.cards[0]?.id || null;
                const card = findCard(state.activeCard);

                const selector = `
                    <div class="card-selector">
                        ${state.cards
                            .map(
                                (c) => `
                            <button class="card-btn ${c.id === state.activeCard ? "active" : ""}" data-card="${escapeHtml(c.id)}" aria-label="${escapeHtml(c.name)} card">
                                ${cardFace(c)}
                                <div class="card-badge">${escapeHtml(c.name)}</div>
                            </button>`,
                            )
                            .join("")}
                        <button class="card-btn card-add" onclick="openCardEditor()" aria-label="Add a card">
                            <span class="plus">+</span><span>Add a card</span>
                        </button>
                    </div>`;

                if (!card) {
                    p.innerHTML = `
                        ${selector}
                        <div class="empty"><span class="glyph">◦</span>No cards yet.<br>Add your bank or prepaid cards to track their balance.</div>`;
                    bindCardSelector(p);
                    return;
                }

                const st = CARD_STYLES[card.style] || CARD_STYLES.default;
                const color = cardColor(card);
                const ops = state.carte.filter((c) => c.card === card.id);
                const balance = cardBalance(card.id);
                const fxSpent = ops.filter((c) => c.type === "Achat" && c.currency !== "DT").reduce((s, c) => s + c.total_dt, 0);
                const limit = card.fx && card.fx_limit ? Number(card.fx_limit) : 0;

                p.innerHTML = `
                    ${selector}
                    <div class="carte-hero" style="background:linear-gradient(160deg, ${color}26 0%, var(--bg-2) 70%);border-color:${color}40">
                        <div class="hero-label" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                            <span>${escapeHtml(card.name)}</span>
                            <button class="card-edit-btn" onclick="openCardEditor('${escapeHtml(card.id)}')">Edit</button>
                        </div>
                        <div class="hero-value" style="color:${color}"><span class="carte-solde-val">0.00</span><span class="unit">DT</span></div>
                        <div class="hero-sub">${ops.length} operation${ops.length === 1 ? "" : "s"}${card.fx ? " · USD / EUR allowed" : ""}</div>
                        ${
                            limit
                                ? `
                            <div class="plafond-bar-wrap">
                                <div class="plafond-label">
                                    <span>Annual foreign-currency limit</span>
                                    <span><span class="plafond-used">0</span> / ${fmtInt(limit)} DT</span>
                                </div>
                                <div class="plafond-bar"><div class="plafond-fill"></div></div>
                            </div>`
                                : ""
                        }
                    </div>
                    <div class="carte-list"></div>
                `;
                bindCardSelector(p);
                animateNumber(p.querySelector(".carte-solde-val"), 0, balance);
                if (limit) {
                    animateNumber(p.querySelector(".plafond-used"), 0, fxSpent);
                    const fill = p.querySelector(".plafond-fill");
                    requestAnimationFrame(() => requestAnimationFrame(() => (fill.style.transform = "scaleX(" + Math.min(1, fxSpent / limit) + ")")));
                }
                renderListInto(p.querySelector(".carte-list"), ops, "carte");
            }

            function bindCardSelector(p) {
                p.querySelectorAll(".card-btn[data-card]").forEach((btn) => {
                    btn.onclick = () => {
                        vibrate(40);
                        state.activeCard = btn.dataset.card;
                        renderCarte();
                    };
                });
            }

            // ----- Card editor (add / edit / delete) -----
            let editingCard = null; // card id being edited, or null for a new card
            let cardDraftImage = null; // uploaded image (data URL) for the "custom" style
            let cardDraftColor = null; // color picked from PALETTE

            function renderCardColors() {
                const el = document.getElementById("card-colors");
                el.innerHTML = PALETTE.map((c) => `<button type="button" class="swatch ${c.toLowerCase() === (cardDraftColor || "").toLowerCase() ? "active" : ""}" style="background:${c}" aria-label="Color ${c}"></button>`).join("");
                el.querySelectorAll(".swatch").forEach((b, i) => {
                    b.onclick = () => {
                        vibrate(25);
                        cardDraftColor = PALETTE[i];
                        renderCardColors();
                    };
                });
            }

            function openCardEditor(id) {
                vibrate(35);
                const card = id ? findCard(id) : null;
                editingCard = card ? card.id : null;
                cardDraftImage = card?.image || null;
                document.getElementById("card-modal-title").textContent = card ? "Edit card" : "New card";
                document.getElementById("card-name").value = card?.name || "";
                document.getElementById("card-fx").checked = !!card?.fx;
                document.getElementById("card-fx-limit").value = card?.fx_limit || "";
                document.getElementById("card-delete-row").style.display = card ? "flex" : "none";
                document.getElementById("card-file").value = "";
                // new card: first palette color no other card uses yet, so dashboard tiles differ
                const used = state.cards.map((c) => cardColor(c).toLowerCase());
                cardDraftColor = card ? cardColor(card) : PALETTE.find((c) => !used.includes(c.toLowerCase())) || PALETTE[0];
                document.getElementById("card-color-field").style.display = prefsReady ? "block" : "none";
                renderCardColors();
                setCardStyle(card?.style || "default");
                onCardFxChange();
                document.getElementById("card-modal-backdrop").classList.add("open");
            }

            function closeCardEditor() {
                vibrate(25);
                document.getElementById("card-modal-backdrop").classList.remove("open");
            }

            function setCardStyle(style) {
                document.querySelectorAll("#card-style-grid .style-opt").forEach((b) => b.classList.toggle("active", b.dataset.style === style));
                document.getElementById("card-upload-field").style.display = style === "custom" ? "block" : "none";
                // presets: sensible defaults for currency support
                updateCardPreview();
            }

            const selectedCardStyle = () => document.querySelector("#card-style-grid .style-opt.active")?.dataset.style || "default";

            function updateCardPreview() {
                const style = selectedCardStyle();
                const name = document.getElementById("card-name").value.trim() || "My card";
                document.getElementById("card-preview").innerHTML = cardFace({ style, name, image: cardDraftImage });
                const customOpt = document.querySelector('#card-style-grid [data-style="custom"] .style-thumb');
                customOpt.innerHTML = cardDraftImage ? `<img src="${cardDraftImage}" alt="">` : "<span>⇪</span>";
            }

            function onCardFxChange() {
                document.getElementById("card-fx-limit-field").style.display = document.getElementById("card-fx").checked ? "block" : "none";
            }

            // Resize the uploaded picture in the browser (max 640×404, JPEG) so it stays small
            function onCardFile(input) {
                const file = input.files && input.files[0];
                if (!file) return;
                if (!/^image\//.test(file.type)) return toast("Choose an image file", true);
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const W = 640,
                            H = 404; // credit-card ratio
                        const canvas = document.createElement("canvas");
                        canvas.width = W;
                        canvas.height = H;
                        const ctx = canvas.getContext("2d");
                        const scale = Math.max(W / img.width, H / img.height); // cover
                        const w = img.width * scale,
                            h = img.height * scale;
                        ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
                        cardDraftImage = canvas.toDataURL("image/jpeg", 0.82);
                        setCardStyle("custom");
                    };
                    img.onerror = () => toast("Could not read this image", true);
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            }

            async function saveCard() {
                vibrate(45);
                const name = document.getElementById("card-name").value.trim();
                const style = selectedCardStyle();
                const fx = document.getElementById("card-fx").checked;
                const limitVal = parseFloat(document.getElementById("card-fx-limit").value);
                if (!name) return toast("Give the card a name", true);
                if (name.length > 60) return toast("Name is too long", true);
                if (style === "custom" && !cardDraftImage) return toast("Upload an image or pick another look", true);

                const existing = editingCard ? findCard(editingCard) : null;
                const card = {
                    id: existing?.id || newId("k"),
                    name,
                    style,
                    image: style === "custom" ? cardDraftImage : null,
                    fx,
                    fx_limit: fx && limitVal > 0 ? limitVal : null,
                };
                // the color column exists only once supabase/005_card_colors_prefs.sql has been run
                if (prefsReady) card.color = isColor(cardDraftColor) ? cardDraftColor : null;
                if (existing) Object.assign(existing, card);
                else state.cards.push({ ...card, created_at: new Date().toISOString() });
                state.activeCard = card.id;
                closeCardEditor();
                render();
                toast(existing ? "Card updated" : "Card added");

                setSync("syncing", "Sync…");
                const { error } = await sb.from("cards").upsert({ ...card, user_id: currentUser.id });
                if (error) {
                    setSync("error", "Error");
                    toast("Could not save card: " + error.message, true);
                } else setSync("", "Up to date");
            }

            async function deleteCard() {
                vibrate(50);
                const card = findCard(editingCard);
                if (!card) return;
                const ops = state.carte.filter((c) => c.card === card.id);
                const msg = ops.length ? `Delete "${card.name}" and its ${ops.length} operation${ops.length === 1 ? "" : "s"}? This cannot be undone.` : `Delete "${card.name}"?`;
                if (!confirm(msg)) return;
                state.cards = state.cards.filter((c) => c.id !== card.id);
                state.carte = state.carte.filter((c) => c.card !== card.id);
                state.activeCard = state.cards[0]?.id || null;
                closeCardEditor();
                render();
                toast("Card deleted");

                setSync("syncing", "Sync…");
                const r1 = await sb.from("carte").delete().eq("card", card.id).eq("user_id", currentUser.id);
                const r2 = r1.error ? r1 : await sb.from("cards").delete().eq("id", card.id).eq("user_id", currentUser.id);
                if (r2.error) {
                    setSync("error", "Error");
                    toast("Could not delete card: " + r2.error.message, true);
                } else setSync("", "Up to date");
            }

            function renderListInto(container, items, kind) {
                if (items.length === 0) {
                    container.innerHTML = `<div class="empty"><span class="glyph">◦</span>Nothing to show yet.</div>`;
                    return;
                }
                const groups = groupByDay(items);
                container.innerHTML = "";
                let animDelay = 0;
                groups.forEach((g) => {
                    const dayDiv = document.createElement("div");
                    dayDiv.className = "day-group";
                    let totalDay = 0;
                    if (kind === "depense") totalDay = g.items.filter((i) => i.category !== "Epargne" && i.category !== "Offset").reduce((s, i) => s + i.amount, 0);
                    else if (kind === "revenu") totalDay = g.items.filter((i) => i.source !== "offset" && i.source !== "Offset").reduce((s, i) => s + i.amount, 0);
                    else totalDay = g.items.filter((i) => i.type === "Achat").reduce((s, i) => s + i.total_dt, 0);
                    const label = document.createElement("div");
                    label.className = "day-label";
                    label.innerHTML = `${dayLabel(g.date)} <span class="day-total">${fmt(totalDay)} DT</span>`;
                    dayDiv.appendChild(label);
                    g.items.forEach((it) => {
                        const row = document.createElement("div");
                        row.className = "list-item";
                        row.style.animationDelay = animDelay + "s";
                        animDelay += 0.03;
                        let iconGlyph,
                            iconColor,
                            iconBg,
                            desc,
                            meta,
                            amt,
                            cls,
                            offsetBadge = "";
                        if (kind === "depense") {
                            const info = catInfo(it.category);
                            iconGlyph = info.glyph;
                            iconColor = info.color;
                            iconBg = info.color + "20";
                            desc = it.description || "—";
                            const out = isWithdrawal(it);
                            meta = it.category === "Epargne" ? (out ? "Savings · taken out" : "Savings · put in") : info.label;
                            amt = (out ? "−" : "") + fmt(Math.abs(it.amount));
                            cls = it.category === "Epargne" ? (out ? "neg" : "pos") : it.category === "Offset" ? "offset" : "neg";
                            if (it.category === "Offset") offsetBadge = `<span class="offset-badge">Offset</span>`;
                        } else if (kind === "revenu") {
                            const isOffset = it.source === "offset" || it.source === "Offset";
                            iconGlyph = isOffset ? "⟳" : "+";
                            iconColor = isOffset ? "#888" : "#6DB89B";
                            iconBg = isOffset ? "#88820" : "rgba(109, 184, 155, 0.15)";
                            desc = it.source || "—";
                            meta = isOffset ? "Offset" : "Income";
                            amt = fmt(it.amount);
                            cls = isOffset ? "offset" : "pos";
                            if (isOffset) offsetBadge = `<span class="offset-badge">Offset</span>`;
                        } else {
                            const isAchat = it.type === "Achat";
                            const cat = isAchat && it.category ? catInfo(it.category) : null;
                            iconGlyph = cat ? cat.glyph : isAchat ? "−" : "+";
                            iconColor = cat ? cat.color : isAchat ? "#9B87BE" : "#6DB89B";
                            iconBg = iconColor + "20";
                            desc = it.description || "—";
                            let extra = "";
                            if (it.currency === "USD" && it.usd) extra = ` · ${it.usd} $`;
                            else if (it.currency === "EUR" && it.eur) extra = ` · ${fmt(it.eur)} €`;
                            meta = `${CARD_OP_LABELS[it.type] || it.type}${cat ? " · " + cat.label : ""}${extra}`;
                            amt = fmt(it.total_dt);
                            cls = isAchat ? "neg" : "pos";
                        }
                        row.classList.add(cls);
                        row.innerHTML = `
                            <div class="cat-icon" style="background:${iconBg};color:${iconColor}">${escapeHtml(iconGlyph)}</div>
                            <div class="body">
                                <div class="desc">${escapeHtml(desc)} ${offsetBadge}</div>
                                <div class="meta">${escapeHtml(meta)}</div>
                            </div>
                            <div class="amt">${amt}<span class="unit">DT</span></div>
                        `;
                        row.onclick = () => {
                            vibrate(35);
                            openEditModal(kind, it.id);
                        };
                        dayDiv.appendChild(row);
                    });
                    container.appendChild(dayDiv);
                });
            }

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
            }

            // ============ MODAL ============
            function openAddModal() {
                vibrate(45);
                editing = null;
                document.getElementById("modal-title").textContent = "New entry";
                setSavingsDir("in");
                document.getElementById("entry-date").valueAsDate = new Date();
                document.getElementById("entry-desc").value = "";
                document.getElementById("entry-source").value = "";
                document.getElementById("entry-amount").value = "";
                document.getElementById("carte-op-type").value = "Achat";
                document.getElementById("carte-devise").value = "DT";
                fillCardSelect(state.activeCard);
                document.getElementById("delete-row").style.display = "none";
                const typeSel = document.getElementById("entry-type");
                if (currentPage === "revenus") typeSel.value = "revenu";
                else if (currentPage === "carte") typeSel.value = "carte";
                else typeSel.value = "depense";
                renderCatGrid("Bouffe");
                onEntryTypeChange();
                document.getElementById("modal-backdrop").classList.add("open");
            }

            function openEditModal(kind, id) {
                vibrate(35);
                editing = { kind, id };
                document.getElementById("modal-title").textContent = "Edit";
                setSavingsDir("in");
                document.getElementById("delete-row").style.display = "flex";

                    document.getElementById("entry-amount").value = Math.abs(entry.amount);
                    setSavingsDir(isWithdrawal(entry) ? "out" : "in");

                } else if (kind === "revenu") {
                    entry = state.revenus.find((r) => r.id === id);
                    document.getElementById("entry-date").value = entry.date || "";
                    document.getElementById("entry-source").value = entry.source || "";
                    document.getElementById("entry-amount").value = entry.amount;
                } else {
                    entry = state.carte.find((c) => c.id === id);

                    document.getElementById("entry-desc").value = entry.description || "";

                    else if (entry.currency === "EUR") a = entry.eur;

            function closeModal() {
                vibrate(25);

            function onEntryTypeChange() {
                const t = document.getElementById("entry-type").value;
                document.getElementById("field-desc").style.display = t === "revenu" ? "none" : "block";
                document.getElementById("field-source").style.display = t === "revenu" ? "block" : "none";

            // A withdrawal is stored as a negative "Epargne" amount, so cash goes back up

                return document.querySelector("#cat-grid .cat-btn.active")?.dataset.cat || "Autre";

            // Fill the "Which card?" dropdown with the user's cards
            function fillCardSelect(selected) {
                const sel = document.getElementById("carte-which");
                sel.innerHTML = state.cards.map((c) => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("");

                if (selected && !findCard(selected)) sel.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(selected)}">${escapeHtml(selected)}</option>`);

            function calcCarteTotal() {
                if (document.getElementById("entry-type").value !== "carte") return;
                const dev = document.getElementById("carte-devise").value;
                const amt = parseFloat(document.getElementById("entry-amount").value) || 0;
                let tot = amt;
                if (dev === "USD") tot = amt * state.taux.usd_vente;
                else if (dev === "EUR") tot = amt * state.taux.eur_vente;
                document.getElementById("carte-preview").textContent = fmt(tot) + " DT";
                document.getElementById("amount-label").textContent = "Amount (" + dev + ")";

            function renderCatGrid(sel) {
                const g = document.getElementById("cat-grid");
                g.innerHTML = "";
                const cardMode = document.getElementById("entry-type").value === "carte" && cardCatReady && document.getElementById("carte-op-type").value === "Achat";
                g.dataset.mode = cardMode ? "card" : "cash";
                const cats = allCategories().filter((c) => !(cardMode && c.name === "Epargne"));
                // an expense whose custom category was deleted still shows its value
                if (sel && !cats.some((c) => c.name === sel)) cats.push(catInfo(sel));
                cats.forEach((c) => {
                    const b = document.createElement("button");
                    b.type = "button";
                    b.className = "cat-btn" + (c.name === sel ? " active" : "");
                    b.dataset.cat = c.name;
                    b.innerHTML = `<span class="glyph" style="color:${c.color}">${escapeHtml(c.glyph)}</span>${escapeHtml(c.label)}`;

                        vibrate(30);

            async function saveEntry() {
                vibrate(45);
                const t = document.getElementById("entry-type").value;
                const date = document.getElementById("entry-date").value;
                const amt = parseFloat(document.getElementById("entry-amount").value);
                if (isNaN(amt) || amt <= 0) {
                    toast("Amount required", true);
                    return;
                }
                let kind, entry;
                if (t === "depense") {
                    kind = "depense";
                    const cat = selectedCategory();
                    const withdraw = cat === "Epargne" && getSavingsDir() === "out";
                    if (withdraw) {
                        const available = savingsBalance(editing?.kind === "depense" ? editing.id : undefined);
                        if (amt > available + 0.001) {
                            toast(`Only ${fmt(available)} DT in savings`, true);
                            return;
                        }
                    }
                    entry = {
                        id: editing?.id || newId("d"),
                        date: date || null,
                        description: document.getElementById("entry-desc").value.trim(),
                        category: cat,
                        amount: withdraw ? -amt : amt,
                    };
                    if (editing) {
                        const idx = state.depenses.findIndex((d) => d.id === editing.id);
                        if (idx >= 0) state.depenses[idx] = entry;
                    } else state.depenses.push(entry);
                } else if (t === "revenu") {
                    kind = "revenu";
                    entry = {
                        id: editing?.id || newId("r"),
                        date: date || null,
                        source: document.getElementById("entry-source").value.trim() || "—",
                        amount: amt,
                    };
                    if (editing) {
                        const idx = state.revenus.findIndex((r) => r.id === editing.id);
                        if (idx >= 0) state.revenus[idx] = entry;
                    } else state.revenus.push(entry);
                } else {
                    kind = "carte";
                    const which = document.getElementById("carte-which").value;
                    if (!which) {
                        toast("Add a card first (Cards tab)", true);
                        return;
                    }
                    const dev = findCard(which)?.fx ? document.getElementById("carte-devise").value : "DT";
                    const rate = dev === "USD" ? state.taux.usd_vente : dev === "EUR" ? state.taux.eur_vente : 1;
                    entry = {
                        id: editing?.id || newId("c"),
                        date: date || null,
                        description: document.getElementById("entry-desc").value.trim(),
                        type: document.getElementById("carte-op-type").value,
                        currency: dev,
                        usd: dev === "USD" ? amt : 0,
                        eur: dev === "EUR" ? amt : 0,
                        rate: rate,
                        total_dt: amt * rate,
                        card: which,
                    };
                    // category column exists once supabase/006_card_categories.sql has been run
                    if (cardCatReady) entry.category = entry.type === "Achat" ? selectedCategory() : null;
                    if (editing) {
                        const idx = state.carte.findIndex((c) => c.id === editing.id);
                        if (idx >= 0) state.carte[idx] = entry;
                    } else state.carte.push(entry);
                }
                closeModal();
                render();
                toast(editing ? "Updated" : "Saved");
                await pushEntry(kind, entry);
            }

            async function saveCategory() {
                vibrate(45);
                const name = document.getElementById("cat-name").value.trim();
                const glyph = [...document.getElementById("cat-glyph").value.trim()].slice(0, 2).join("") || "•";
                const color = selectedCategoryColor();
                if (!name) return toast("Give the category a name", true);
                if (name.length > 30) return toast("Name is too long (30 max)", true);
                const taken = allCategories().some((c) => c.label.toLowerCase() === name.toLowerCase() && c.name !== editingCategory);

                else state.categories.push({ ...cat, created_at: new Date().toISOString() });

                    renderCatGrid(cat.id);

                } else render();

            async function deleteCategory() {
                vibrate(50);
                const cat = state.categories.find((c) => c.id === editingCategory);
                if (!cat) return;
                const usedCash = state.depenses.filter((d) => d.category === cat.id);
                const usedCard = state.carte.filter((c) => c.category === cat.id);
                const used = [...usedCash, ...usedCard];
                const msg = used.length ? `Delete "${cat.name}"? Its ${used.length} entr${used.length === 1 ? "y" : "ies"} will move to "Other".` : `Delete "${cat.name}"?`;
                if (!confirm(msg)) return;
                used.forEach((d) => (d.category = "Autre"));
                state.categories = state.categories.filter((c) => c.id !== cat.id);
                if (currentFilter === cat.id) currentFilter = "All";
                closeCategoryEditor();
                render();
                toast("Category deleted");

                setSync("syncing", "Sync…");
                const uid = currentUser.id;
                const r0 = usedCash.length ? await sb.from("depenses").update({ category: "Autre" }).eq("category", cat.id).eq("user_id", uid) : { error: null };
                const r1 = r0.error ? r0 : usedCard.length ? await sb.from("carte").update({ category: "Autre" }).eq("category", cat.id).eq("user_id", uid) : { error: null };
                const r2 = r1.error ? r1 : await sb.from("categories").delete().eq("id", cat.id).eq("user_id", uid);
                if (r2.error) {
                    setSync("error", "Error");
                    toast("Could not delete category: " + r2.error.message, true);
                } else setSync("", "Up to date");
            }

            // ============ GOALS ============
            const GOAL_SCOPES = { savings: "Savings", total: "Total balance", card: "Card" };

            function goalCurrent(goal) {
                if (goal.scope === "total") return computeBalances().total;
                if (goal.scope === "card") return cardBalance(goal.card_id);
                return savingsBalance();
            }

            function goalScopeLabel(goal) {
                return goal.scope === "card" ? cardName(goal.card_id) : GOAL_SCOPES[goal.scope] || goal.scope;
            }

            // Days left, and how much is needed per day / month to reach the target in time
            function goalPace(goal, current) {
                if (!goal.target_date) return "";
                const remaining = goal.target - current;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const end = new Date(goal.target_date + "T00:00:00");
                const days = Math.round((end - today) / 86400000);
                const dateTxt = end.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
                if (remaining <= 0) return `Target date ${dateTxt}`;
                if (days < 0) return `<span style="color:var(--danger)">Deadline passed (${dateTxt})</span>`;
                if (days === 0) return `Due today · ${fmt(remaining)} DT missing`;
                const perMonth = days >= 45 ? ` · ${fmt(remaining / (days / 30.44))} DT/month` : "";
                return `By ${dateTxt} · ${days} day${days === 1 ? "" : "s"} left · ${fmt(remaining / days)} DT/day${perMonth}`;
            }

            function renderGoals() {
                const el = document.getElementById("goals");
                if (!el) return;
                if (!featuresReady) {
                    el.innerHTML = "";
                    return;
                }
                if (!state.goals.length) {
                    el.innerHTML = `<button class="goal-empty" onclick="openGoalEditor()"><span class="plus">+</span>Set a goal: a target amount, a date, and what to track (savings, total balance or a card).</button>`;
                    return;
                }
                el.innerHTML = state.goals
                    .map((g, i) => {
                        const current = goalCurrent(g);
                        const pct = Math.max(0, Math.min(1, current / g.target));
                        const done = current >= g.target;
                        const pace = goalPace(g, current);
                        return `
                        <div class="goal-card" onclick="openGoalEditor('${escapeHtml(g.id)}')" style="cursor:pointer">
                            <div class="goal-header">
                                <div class="goal-title">${escapeHtml(g.name)}</div>
                                <div class="goal-target">${escapeHtml(goalScopeLabel(g))} · ${fmtInt(g.target)} DT</div>
                            </div>
                            <div class="goal-progress-wrap">
                                <div class="goal-progress" style="--goal-scale:${pct};transform:scaleX(${pct});animation-delay:${0.3 + i * 0.1}s"></div>
                            </div>
                            <div class="goal-numbers">
                                <div class="goal-current">${fmt(current)}<span style="font-size:14px;color:var(--text-3);margin-left:4px">DT</span></div>
                                <div class="goal-remain">${done ? "Reached ✓" : `${(pct * 100).toFixed(0)}% · ${fmt(g.target - current)} DT to go`}</div>
                            </div>
                            ${pace ? `<div class="goal-pace">${pace}</div>` : ""}
                        </div>`;
                    })
                    .join("");
            }
