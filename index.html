            // ============ HELPERS ============
            function catInfo(name) {
                return CATEGORIES.find((c) => c.name === name) || { name, label: name, glyph: "·", color: "#6B6E68" };
            }

            function isThisMonth(iso) {
                if (!iso) return false;
                const d = new Date(iso);
                const now = new Date();
                return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
            }

            // Random, collision-proof ids for new rows (several users share the same tables)
            function newId(prefix) {
                if (crypto.randomUUID) return prefix + crypto.randomUUID();
                const b = crypto.getRandomValues(new Uint8Array(16));
                return prefix + Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
            }

            // Is a "YYYY-MM-DD" date inside the chosen breakdown period?
            // "3m" = the current month plus the two before it. Undated entries only count in "all".
            function inPeriod(iso, period) {
                if (period === "all") return true;
                if (!iso) return false;
                const [y, m] = iso.split("-").map(Number);
                const now = new Date();
                const monthsAgo = (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
                if (period === "month") return monthsAgo === 0;
                if (period === "3m") return monthsAgo >= 0 && monthsAgo <= 2;
                if (period === "year") return y === now.getFullYear();
                return true;
            }

            const catLabel = (name) => catInfo(name).label;
            const isWithdrawal = (d) => d.category === "Epargne" && d.amount < 0;

            function dayLabel(iso) {
                if (!iso) return "No date";
                const d = new Date(iso);
                if (isNaN(d)) return iso;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const target = new Date(d);
                target.setHours(0, 0, 0, 0);
                const diff = Math.round((today - target) / 86400000);
                if (diff === 0) return "Today";
                if (diff === 1) return "Yesterday";
                if (diff < 7) return d.toLocaleDateString("en-US", { weekday: "long" });
                return d.toLocaleDateString("en-US", { day: "numeric", month: "long" });
            }

            function groupByDay(items) {
                const g = {};
                items.forEach((it) => {
                    const d = it.date || "";
                    if (!g[d]) g[d] = [];
                    g[d].push(it);
                });
                return Object.keys(g)
                    .sort((a, b) => b.localeCompare(a))
                    .map((d) => ({ date: d, items: g[d] }));
            }

            function animateNumber(el, from, to, duration = 700) {
                const start = performance.now();

                function step(now) {
                    const t = Math.min(1, (now - start) / duration);
                    const eased = 1 - Math.pow(1 - t, 3);
                    const val = from + (to - from) * eased;
                    el.textContent = fmt(val);
                    if (t < 1) requestAnimationFrame(step);
                    else el.textContent = fmt(to);
                }
                requestAnimationFrame(step);
            }

            // ============ NAVIGATION ============
            document.querySelectorAll(".tab").forEach((t) => {
                t.addEventListener("click", () => {
                    vibrate(35);
                    showPage(t.dataset.page);
                });
            });

            function showPage(name) {
                if (name === currentPage) return;
                currentPage = name;
                document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
                const pageEl = document.getElementById("page-" + name);
                if (pageEl) pageEl.classList.add("active");
                document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.page === name));
                document.getElementById("page-title").textContent = TAB_TITLES[name] || name;
                document.getElementById("fab-wrap").style.display = name === "settings" ? "none" : "block";
                render();
                hideSwipeArrows();
            }

            // ============ RENDER ============
            function render() {
                if (currentPage === "dashboard") renderDashboard();
                else if (currentPage === "depenses") renderDepenses();
                else if (currentPage === "revenus") renderRevenus();
                else if (currentPage === "carte") renderCarte();
                else if (currentPage === "settings") renderSettings();
            }

            // ============ DASHBOARD ============
            function cardBalance(card) {
                const ops = state.carte.filter((c) => c.card === card);
                const plus = ops.filter((c) => c.type === "Rechargement" || c.type === "Remboursement").reduce((s, c) => s + c.total_dt, 0);
                const minus = ops.filter((c) => c.type === "Achat").reduce((s, c) => s + c.total_dt, 0);
                return plus - minus;
            }

            // Savings balance = deposits (positive "Epargne" rows) minus withdrawals (negative ones)
            function savingsBalance(excludeId) {
                return state.depenses.filter((d) => d.category === "Epargne" && d.id !== excludeId).reduce((s, d) => s + d.amount, 0);
            }

            function computeBalances() {
                // Balances include offsets
                const totalIncome = state.revenus.reduce((s, r) => s + r.amount, 0);
                const totalExpenses = state.depenses.reduce((s, d) => s + d.amount, 0);
                const cash = totalIncome - totalExpenses;
                const d17 = cardBalance("d17");
                const techno = cardBalance("techno");
                return { cash, d17, techno, savings: savingsBalance(), total: cash + d17 + techno };
            }

            function renderDashboard() {
                const now = new Date();
                const monthName = MONTH_NAMES[now.getMonth()];
                const bal = computeBalances();

                // Stats exclude offsets and savings movements
                const spending = state.depenses.filter((d) => d.category !== "Offset" && d.category !== "Epargne");
                const thisMonth = spending.filter((d) => isThisMonth(d.date));
                const monthTotal = thisMonth.reduce((s, d) => s + d.amount, 0);
                const daysActive = new Set(thisMonth.map((d) => d.date)).size;
                const avgDay = daysActive ? monthTotal / daysActive : 0;

                const allCatTotals = {};
                spending.forEach((d) => (allCatTotals[d.category] = (allCatTotals[d.category] || 0) + d.amount));

                const p = document.getElementById("page-dashboard");
                p.innerHTML = `
                    <!-- Main card: total balance -->
                    <div class="hero-card">
                        <div class="hero-label">Total balance</div>
                        <div class="hero-value"><span id="hero-total">0.00</span><span class="unit">DT</span></div>
                        <div class="hero-sub">
                            Spent in ${monthName}: ${fmt(monthTotal)} DT <span class="sep">·</span> ${fmt(avgDay)} DT/day
                        </div>
                    </div>

                    <!-- 2×2 grid: Cash, D17, Techno, Savings -->
                    <div class="soldes-grid">
                        <div class="solde-card cash">
                            <div class="icon">💰</div>
                            <div class="label">Cash</div>
                            <div class="value"><span id="solde-cash">0.00</span><span class="unit">DT</span></div>
                            <div class="sub">In hand</div>
                        </div>
                        <div class="solde-card d17">
                            <div class="icon">💳</div>
                            <div class="label">D17</div>
                            <div class="value"><span id="solde-d17">0.00</span><span class="unit">DT</span></div>
                            <div class="sub">La Poste</div>
                        </div>
                        <div class="solde-card techno">
                            <div class="icon">📱</div>
                            <div class="label">Techno</div>
                            <div class="value"><span id="solde-techno">0.00</span><span class="unit">DT</span></div>
                            <div class="sub">Zitouna</div>
                        </div>
                        <div class="solde-card epargne">
                            <div class="icon">✦</div>
                            <div class="label">Savings</div>
                            <div class="value"><span id="solde-epargne">0.00</span><span class="unit">DT</span></div>
                            <div class="sub">Current balance</div>
                        </div>
                    </div>

                    <!-- Breakdown -->
                    <div class="section-head">
                        <div class="section-title">Spending breakdown</div>
                        <select class="period-select" id="period-select" aria-label="Breakdown period">
                            ${PERIODS.map((pr) => `<option value="${pr.id}" ${pr.id === breakdownPeriod ? "selected" : ""}>${pr.label}</option>`).join("")}
                        </select>
                    </div>
                    <div class="repart" id="breakdown"></div>

                    <!-- Goal -->
                    <div class="section-title">Six-month goal</div>
                    <div class="goal-card">
                        <div class="goal-header">
                            <div class="goal-title">Personal savings</div>
                            <div class="goal-target">Target 1,200 DT</div>
                        </div>
                        <div class="goal-progress-wrap">
                            <div class="goal-progress" id="goal-bar"></div>
                        </div>
                        <div class="goal-numbers">
                            <div class="goal-current"><span id="goal-val">0</span><span style="font-size:14px;color:var(--text-3);margin-left:4px">DT</span></div>
                            <div class="goal-remain" id="goal-remain">— left</div>
                        </div>
                    </div>

                    <!-- Insights -->
                    <div class="section-title">What I notice</div>
                    <div id="insights"></div>
                `;

                animateNumber(document.getElementById("hero-total"), 0, bal.total);
                animateNumber(document.getElementById("solde-cash"), 0, bal.cash);
                animateNumber(document.getElementById("solde-d17"), 0, bal.d17);
                animateNumber(document.getElementById("solde-techno"), 0, bal.techno);
                animateNumber(document.getElementById("solde-epargne"), 0, bal.savings);
                animateNumber(document.getElementById("goal-val"), 0, bal.savings);

                const goalPct = Math.max(0, Math.min(1, bal.savings / 1200));
                const bar = document.getElementById("goal-bar");
                bar.style.setProperty("--goal-scale", goalPct);
                bar.style.transform = `scaleX(${goalPct})`;
                document.getElementById("goal-remain").textContent = `${(goalPct * 100).toFixed(0)}% · ${fmt(Math.max(0, 1200 - bal.savings))} DT to go`;

                document.getElementById("period-select").onchange = (e) => {
                    vibrate(30);
                    breakdownPeriod = e.target.value;
                    try {
                        localStorage.setItem(PERIOD_KEY, breakdownPeriod);
                    } catch (_) {}
                    renderBreakdown(spending);
                };
                renderBreakdown(spending);

                // Insights
                const ins = document.getElementById("insights");
                const insights = [];
                if (avgDay > 20) insights.push({ type: "bad", text: `You spend ${fmt(avgDay)} DT/day on average. That's more than a week's rent.` });
                else if (avgDay > 15) insights.push({ type: "warn", text: `Around ${fmt(avgDay)} DT/day. Two or three fewer orders a week would make a real difference.` });
                else if (avgDay > 0 && avgDay <= 10) insights.push({ type: "good", text: `Under 10 DT/day on average. Well kept.` });
                const delivery = allCatTotals["Livraison"] || 0;
                const food = allCatTotals["Bouffe"] || 0;
                if (delivery > food * 2 && delivery > 60) insights.push({ type: "warn", text: `Delivery is well above in-store food. It's the first lever to free up savings.` });
                if (bal.savings >= 100) insights.push({ type: "good", text: `${fmt(bal.savings)} DT set aside so far. The momentum is there.` });
                else if (bal.savings < 30) insights.push({ type: "warn", text: `Savings are still low. Short-term goal: 10 DT every time money comes in.` });
                if (!insights.length) insights.push({ type: "good", text: `Nothing special to report for now. Keep tracking.` });
                insights.forEach((i, idx) => {
                    const div = document.createElement("div");
                    div.className = "insight " + i.type;
                    div.style.animationDelay = idx * 0.08 + 0.2 + "s";
                    div.innerHTML = `<span class="icon">${i.type === "good" ? "✓" : i.type === "bad" ? "!" : "·"}</span><span>${i.text}</span>`;
                    ins.appendChild(div);
                });
            }

            // Donut chart + list of spending per category for the selected period
            function renderBreakdown(spending) {
                const el = document.getElementById("breakdown");
                const totals = {};
                spending.filter((d) => inPeriod(d.date, breakdownPeriod)).forEach((d) => (totals[d.category] = (totals[d.category] || 0) + d.amount));
                const entries = Object.entries(totals)
                    .filter(([, amt]) => amt > 0)
                    .sort((a, b) => b[1] - a[1]);
                const total = entries.reduce((s, e) => s + e[1], 0);

                if (!entries.length) {
                    el.innerHTML = '<div style="color:var(--text-4);padding:24px 0;text-align:center;font-size:12px;">No spending in this period</div>';
                    return;
                }

                const r = 70;
                const C = 2 * Math.PI * r;
                const gap = entries.length > 1 ? 2 : 0;
                let offset = 0;
                const segs = entries
                    .map(([cat, amt], i) => {
                        const len = (amt / total) * C;
                        const visible = Math.max(0.5, len - gap);
                        const s = `<circle class="donut-seg" cx="90" cy="90" r="${r}" stroke="${catInfo(cat).color}" stroke-dasharray="${visible} ${C - visible}" stroke-dashoffset="${-offset}" style="animation-delay:${i * 0.06}s"><title>${escapeHtml(catLabel(cat))}: ${fmt(amt)} DT</title></circle>`;
                        offset += len;
                        return s;
                    })
                    .join("");

                el.innerHTML = `
                    <div class="donut-wrap">
                        <svg viewBox="0 0 180 180" role="img" aria-label="Spending by category">
                            <circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--bg-2)" stroke-width="18" />
                            ${segs}
                        </svg>
                        <div class="donut-center">
                            <div class="total">${fmt(total)}</div>
                            <div class="caption">DT spent</div>
                        </div>
                    </div>
                    <div class="repart-list">
                        ${entries
                            .map(([cat, amt]) => {
                                const info = catInfo(cat);
                                return `
                            <div class="repart-row">
                                <div class="dot" style="background:${info.color}"></div>
                                <div class="name">${escapeHtml(info.label)}</div>
                                <div class="amt">${fmt(amt)} <span style="color:var(--text-3);font-weight:400">DT</span></div>
                                <div class="pct">${((amt / total) * 100).toFixed(0)}%</div>
                            </div>`;
                            })
                            .join("")}
                    </div>
                `;
            }

            function renderCarte() {
                const p = document.getElementById("page-carte");

                const isTechno = activeCard === "techno";

                const gradient = isTechno ? "linear-gradient(160deg, #1D1425 0%, #10131C 100%)" : "linear-gradient(160deg, #1A2419 0%, #0F1913 100%)";

                        <div class="hero-sub">${ops.length} operation${ops.length === 1 ? "" : "s"}</div>
                        ${
                            isTechno
                                ? `
                            <div class="plafond-bar-wrap">
                                <div class="plafond-label">

                                    <span><span class="plafond-used">0</span> / 1,000 DT</span>
                                </div>
                                <div class="plafond-bar"><div class="plafond-fill"></div></div>
                            </div>

                                : ""
                        }
                    </div>
                    <div class="carte-list"></div>

                p.querySelectorAll(".card-btn").forEach((btn) => {
                    btn.onclick = () => {

                    animateNumber(p.querySelector(".plafond-used"), 0, minus);
                    const fill = p.querySelector(".plafond-fill");
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            fill.style.transform = "scaleX(" + plafondPct + ")";
                        });
                    });

            function renderListInto(container, items, kind) {
                if (items.length === 0) {
                    container.innerHTML = `<div class="empty"><span class="glyph">◦</span>Nothing to show yet.</div>`;
                    return;
                }
                const groups = groupByDay(items);
                container.innerHTML = "";
                let animDelay = 0;
                groups.forEach((g) => {
                    const dayDiv = document.createElement("div");
                    dayDiv.className = "day-group";
                    let totalDay = 0;
                    if (kind === "depense") totalDay = g.items.filter((i) => i.category !== "Epargne" && i.category !== "Offset").reduce((s, i) => s + i.amount, 0);
                    else if (kind === "revenu") totalDay = g.items.filter((i) => i.source !== "offset" && i.source !== "Offset").reduce((s, i) => s + i.amount, 0);
                    else totalDay = g.items.filter((i) => i.type === "Achat").reduce((s, i) => s + i.total_dt, 0);
                    const label = document.createElement("div");
                    label.className = "day-label";
                    label.innerHTML = `${dayLabel(g.date)} <span class="day-total">${fmt(totalDay)} DT</span>`;
                    dayDiv.appendChild(label);
                    g.items.forEach((it) => {
                        const row = document.createElement("div");
                        row.className = "list-item";
                        row.style.animationDelay = animDelay + "s";
                        animDelay += 0.03;
                        let iconGlyph,
                            iconColor,
                            iconBg,
                            desc,
                            meta,
                            amt,
                            cls,
                            offsetBadge = "";
                        if (kind === "depense") {
                            const info = catInfo(it.category);
                            iconGlyph = info.glyph;
                            iconColor = info.color;
                            iconBg = info.color + "20";
                            desc = it.description || "—";
                            const out = isWithdrawal(it);
                            meta = it.category === "Epargne" ? (out ? "Savings · taken out" : "Savings · put in") : info.label;
                            amt = (out ? "−" : "") + fmt(Math.abs(it.amount));
                            cls = it.category === "Epargne" ? (out ? "neg" : "pos") : it.category === "Offset" ? "offset" : "neg";
                            if (it.category === "Offset") offsetBadge = `<span class="offset-badge">Offset</span>`;
                        } else if (kind === "revenu") {
                            const isOffset = it.source === "offset" || it.source === "Offset";
                            iconGlyph = isOffset ? "⟳" : "+";
                            iconColor = isOffset ? "#888" : "#6DB89B";
                            iconBg = isOffset ? "#88820" : "rgba(109, 184, 155, 0.15)";
                            desc = it.source || "—";
                            meta = isOffset ? "Offset" : "Income";
                            amt = fmt(it.amount);
                            cls = isOffset ? "offset" : "pos";
                            if (isOffset) offsetBadge = `<span class="offset-badge">Offset</span>`;
                        } else {
                            const isAchat = it.type === "Achat";
                            iconGlyph = isAchat ? "−" : "+";
                            iconColor = isAchat ? "#9B87BE" : "#6DB89B";
                            iconBg = iconColor + "20";
                            desc = it.description || "—";
                            let extra = "";
                            if (it.currency === "USD" && it.usd) extra = ` · ${it.usd} $`;
                            else if (it.currency === "EUR" && it.eur) extra = ` · ${fmt(it.eur)} €`;
                            meta = `${CARD_OP_LABELS[it.type] || it.type}${extra}`;
                            amt = fmt(it.total_dt);
                            cls = isAchat ? "neg" : "pos";
                        }
                        row.classList.add(cls);
                        row.innerHTML = `
                            <div class="cat-icon" style="background:${iconBg};color:${iconColor}">${iconGlyph}</div>
                            <div class="body">
                                <div class="desc">${escapeHtml(desc)} ${offsetBadge}</div>
                                <div class="meta">${escapeHtml(meta)}</div>
                            </div>
                            <div class="amt">${amt}<span class="unit">DT</span></div>
                        `;
                        row.onclick = () => {
                            vibrate(35);
                            openEditModal(kind, it.id);
                        };
                        dayDiv.appendChild(row);
                    });
                    container.appendChild(dayDiv);
                });
            }

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
            }

            function openEditModal(kind, id) {

                    document.getElementById("entry-amount").value = a;

            function onEntryTypeChange() {
                const t = document.getElementById("entry-type").value;
                document.getElementById("field-desc").style.display = t === "revenu" ? "none" : "block";

            // ----- Savings: put money in or take it out -----
            // A withdrawal is stored as a negative "Epargne" amount, so cash goes back up
            // and the savings balance goes down, with no database change needed.
            function selectedCategory() {
                return document.querySelector("#cat-grid .cat-btn.active")?.dataset.cat || "Autre";
            }

            function updateSavingsField() {
                const show = document.getElementById("entry-type").value === "depense" && selectedCategory() === "Epargne";
                document.getElementById("field-savings-dir").style.display = show ? "block" : "none";
            }

            function setSavingsDir(dir) {
                document.querySelectorAll("#savings-dir button").forEach((b) => b.classList.toggle("active", b.dataset.dir === dir));
            }

            function getSavingsDir() {
                return document.querySelector("#savings-dir button.active")?.dataset.dir || "in";
            }

            document.querySelectorAll("#savings-dir button").forEach((b) => {
                b.onclick = () => {
                    vibrate(30);
                    setSavingsDir(b.dataset.dir);
                };
            });

            function onCarteWhichChange() {
                const t = document.getElementById("entry-type").value;
                if (t !== "carte") return;
                const which = document.getElementById("carte-which").value;
                const devSel = document.getElementById("carte-devise");
                const devField = document.getElementById("field-carte-devise");
                if (which === "d17") {
                    devSel.value = "DT";
                    devField.style.display = "none";
                } else {
                    devField.style.display = "block";
                }
                calcCarteTotal();
            }

            function calcCarteTotal() {
                if (document.getElementById("entry-type").value !== "carte") return;
                const dev = document.getElementById("carte-devise").value;
                const amt = parseFloat(document.getElementById("entry-amount").value) || 0;
                let tot = amt;
                if (dev === "USD") tot = amt * state.taux.usd_vente;
                else if (dev === "EUR") tot = amt * state.taux.eur_vente;
                document.getElementById("carte-preview").textContent = fmt(tot) + " DT";
                document.getElementById("amount-label").textContent = "Amount (" + dev + ")";
            }

            function renderCatGrid(sel) {

                    b.type = "button";
                    b.className = "cat-btn" + (c.name === sel ? " active" : "");

            async function saveEntry() {
                vibrate(45);
                const t = document.getElementById("entry-type").value;
                const date = document.getElementById("entry-date").value;
                const amt = parseFloat(document.getElementById("entry-amount").value);
                if (isNaN(amt) || amt <= 0) {
                    toast("Amount required", true);
                    return;
                }
                let kind, entry;
                if (t === "depense") {
                    kind = "depense";
                    const cat = selectedCategory();
                    const withdraw = cat === "Epargne" && getSavingsDir() === "out";
                    if (withdraw) {
                        const available = savingsBalance(editing?.kind === "depense" ? editing.id : undefined);
                        if (amt > available + 0.001) {
                            toast(`Only ${fmt(available)} DT in savings`, true);
                            return;
                        }
                    }
                    entry = {
                        id: editing?.id || newId("d"),
                        date: date || null,
                        description: document.getElementById("entry-desc").value.trim(),
                        category: cat,
                        amount: withdraw ? -amt : amt,
                    };
                    if (editing) {
                        const idx = state.depenses.findIndex((d) => d.id === editing.id);
                        if (idx >= 0) state.depenses[idx] = entry;
                    } else state.depenses.push(entry);
                } else if (t === "revenu") {
                    kind = "revenu";
                    entry = {
                        id: editing?.id || newId("r"),
                        date: date || null,
                        source: document.getElementById("entry-source").value.trim() || "—",
                        amount: amt,
                    };
                    if (editing) {
                        const idx = state.revenus.findIndex((r) => r.id === editing.id);
                        if (idx >= 0) state.revenus[idx] = entry;
                    } else state.revenus.push(entry);
                } else {
                    kind = "carte";
                    const which = document.getElementById("carte-which").value;
                    const dev = which === "d17" ? "DT" : document.getElementById("carte-devise").value;
                    const rate = dev === "USD" ? state.taux.usd_vente : dev === "EUR" ? state.taux.eur_vente : 1;
                    entry = {
                        id: editing?.id || newId("c"),
                        date: date || null,
                        description: document.getElementById("entry-desc").value.trim(),
                        type: document.getElementById("carte-op-type").value,
                        currency: dev,
                        usd: dev === "USD" ? amt : 0,
                        eur: dev === "EUR" ? amt : 0,
                        rate: rate,
                        total_dt: amt * rate,
                        card: which,
                    };
                    if (editing) {
                        const idx = state.carte.findIndex((c) => c.id === editing.id);
                        if (idx >= 0) state.carte[idx] = entry;
                    } else state.carte.push(entry);
                }
                closeModal();
                render();
                toast(editing ? "Updated" : "Saved");
                await pushEntry(kind, entry);
            }

            async function deleteEntry() {
                vibrate(50);
                if (!editing) return;
                if (!confirm("Delete permanently?")) return;
                const { kind, id } = editing;
                if (kind === "depense") state.depenses = state.depenses.filter((d) => d.id !== id);
                else if (kind === "revenu") state.revenus = state.revenus.filter((r) => r.id !== id);
                else state.carte = state.carte.filter((c) => c.id !== id);
                closeModal();
                render();
                toast("Deleted");
                await deleteEntryRemote(kind, id);
            }

                            <div class="info-sub">All expenses, income, card operations and balances (.xlsx)</div>
                        </div>
                        <span class="arrow" style="color:var(--accent)">↓</span>
                    </button>
                    <button class="setting-row" onclick="exportData()">
                        <div class="info">
                            <div class="info-label">Export as JSON</div>
                            <div class="info-sub">Raw backup file</div>
                        </div>
                        <span class="arrow" style="color:var(--accent)">↓</span>
                    </button>
                    <button class="setting-row" onclick="forceSync()">
                        <div class="info">
                            <div class="info-label">Force sync</div>
                            <div class="info-sub">Reload from Supabase</div>
                        </div>
                        <span class="arrow" style="color:var(--accent)">↻</span>
                    </button>

                    <div class="section-eyebrow">Danger zone</div>
                    <button class="setting-row" onclick="resetAll()" style="border-color:rgba(217, 117, 88, 0.3)">
                        <div class="info">
                            <div class="info-label" style="color:var(--danger)">Erase all my entries</div>
                            <div class="info-sub">Keeps the account, deletes every expense, income and card operation</div>
                        </div>
                        <span class="arrow" style="color:var(--danger)">×</span>
                    </button>
                    <button class="setting-row" onclick="deleteAccount()" style="border-color:rgba(217, 117, 88, 0.3)">
                        <div class="info">
                            <div class="info-label" style="color:var(--danger)">Delete my account</div>
                            <div class="info-sub">Deletes the account and all its data. Cannot be undone.</div>
                        </div>
                        <span class="arrow" style="color:var(--danger)">×</span>
                    </button>

                    <div style="text-align:center;padding:40px 0 20px;font-size:11px;color:var(--text-4);letter-spacing:0.15em;">
                        Carnet · v2.0
                    </div>
                `;
                const usdIn = document.getElementById("s-usd");
                const eurIn = document.getElementById("s-eur");
                usdIn.onchange = (e) => {
                    vibrate(35);
                    state.taux.usd_vente = parseFloat(e.target.value);
                    pushTaux();
                    toast("USD rate updated");
                };
                eurIn.onchange = (e) => {
                    vibrate(35);
                    state.taux.eur_vente = parseFloat(e.target.value);
                    pushTaux();
                    toast("EUR rate updated");
                };
            }

            const byDate = (a, b) => (a.date || "").localeCompare(b.date || "");
            const round2 = (n) => Math.round(n * 1000) / 1000;

            function exportExcel() {
                vibrate(35);
                if (typeof XLSX === "undefined") {
                    toast("Excel library not loaded yet, try again", true);
                    return;
                }
                const bal = computeBalances();
                const expenses = [...state.depenses].sort(byDate).map((d) => ({
                    Date: d.date || "",
                    Description: d.description || "",
                    Category: catLabel(d.category),
                    Movement: d.category === "Epargne" ? (d.amount < 0 ? "Taken out of savings" : "Put into savings") : "",
                    "Amount (DT)": round2(d.amount),
                }));
                const income = [...state.revenus].sort(byDate).map((r) => ({
                    Date: r.date || "",
                    Source: r.source || "",
                    Offset: r.source === "offset" || r.source === "Offset" ? "Yes" : "",
                    "Amount (DT)": round2(r.amount),
                }));
                const cards = [...state.carte].sort(byDate).map((c) => ({
                    Date: c.date || "",
                    Card: CARD_NAMES[c.card] || c.card,
                    Description: c.description || "",
                    Type: CARD_OP_LABELS[c.type] || c.type,
                    Currency: c.currency,
                    "Original amount": c.currency === "USD" ? c.usd : c.currency === "EUR" ? c.eur : round2(c.total_dt),
                    Rate: c.rate,
                    "Total (DT)": round2(c.total_dt),
                }));
                const summary = [
                    { Item: "Total balance", "Value (DT)": round2(bal.total) },
                    { Item: "Cash", "Value (DT)": round2(bal.cash) },
                    { Item: "D17 card", "Value (DT)": round2(bal.d17) },
                    { Item: "Techno card", "Value (DT)": round2(bal.techno) },
                    { Item: "Savings", "Value (DT)": round2(bal.savings) },
                    { Item: "USD selling rate", "Value (DT)": state.taux.usd_vente },
                    { Item: "EUR selling rate", "Value (DT)": state.taux.eur_vente },
                    { Item: "Exported on", "Value (DT)": new Date().toISOString().slice(0, 10) },
                ];

                const wb = XLSX.utils.book_new();
                const add = (rows, name, widths) => {
                    const ws = XLSX.utils.json_to_sheet(rows);
                    ws["!cols"] = widths.map((w) => ({ wch: w }));
                    XLSX.utils.book_append_sheet(wb, ws, name);
                };
                add(summary, "Summary", [22, 14]);
                add(expenses, "Expenses", [12, 40, 12, 22, 12]);
                add(income, "Income", [12, 32, 8, 12]);
                add(cards, "Cards", [12, 22, 34, 10, 9, 15, 8, 11]);
                XLSX.writeFile(wb, "carnet-" + new Date().toISOString().slice(0, 10) + ".xlsx");
                toast("Excel file exported");
            }

            function exportData() {
                vibrate(35);
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "carnet-" + new Date().toISOString().slice(0, 10) + ".json";
                a.click();
                URL.revokeObjectURL(url);
                toast("Exported");
            }

            async function forceSync() {
                vibrate(40);
                document.getElementById("loading").style.display = "flex";
                await bootstrap();
                document.getElementById("loading").style.display = "none";
                render();
                toast("Synced");
            }

            async function resetAll() {
                vibrate(50);
                if (!confirm("Erase all your entries? Your account stays.")) return;
                if (!confirm("Final confirmation: delete every entry?")) return;
                setSync("syncing", "Erasing…");
                try {
                    await sb.from("depenses").delete().neq("id", "");
                    await sb.from("revenus").delete().neq("id", "");
                    await sb.from("carte").delete().neq("id", "");
                    state.depenses = [];
                    state.revenus = [];
                    state.carte = [];
                    render();
                    setSync("", "Up to date");
                    toast("Everything erased");
                } catch (e) {
                    setSync("error", "Error");
                    toast("Error", true);
                }
            }

            // ============ TOAST ============
            function toast(msg, isError = false) {
                const el = document.getElementById("toast");
                el.className = "toast" + (isError ? " error" : "");
                document.getElementById("toast-text").textContent = msg;
                document.querySelector(".toast-icon").textContent = isError ? "!" : "✓";
                el.classList.add("show");
                clearTimeout(el._t);
                el._t = setTimeout(() => el.classList.remove("show"), 2000);
            }

            // ============ INIT ============
            initAuth();
            document.getElementById("modal-backdrop").addEventListener("click", (e) => {
                if (e.target.id === "modal-backdrop") closeModal();
            });

            const fab = document.querySelector(".fab");
            if (fab) {
                const orig = fab.onclick;
                fab.onclick = function (e) {
                    vibrate(45);
                    if (orig) orig.call(this, e);
                };
            }
            const settingsBtn = document.getElementById("settings-btn");
            if (settingsBtn) {
                const orig = settingsBtn.onclick;
                settingsBtn.onclick = function (e) {
                    vibrate(35);
                    if (orig) orig.call(this, e);
                };
            }
            
        </script>
    </body>
</html>
