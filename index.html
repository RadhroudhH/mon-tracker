                            <div>
                                <div class="info-label">${escapeHtml(c.name)}</div>
                                <div class="info-sub">${state.depenses.filter((d) => d.category === c.id).length + state.carte.filter((x) => x.category === c.id).length} entries</div>
                            </div>
                        </div>
                        <span class="arrow">›</span>
                    </button>`,
                        )
                        .join("")}
                    <button class="setting-row" onclick="openCategoryEditor()">
                        <div class="info">
                            <div class="info-label" style="color:var(--accent)">+ Add a category</div>
                            <div class="info-sub">Built-in: ${CATEGORIES.map((c) => c.label).join(", ")}</div>
                        </div>
                    </button>`
                            : ""
                    }
                `;
            }

            // ============ SETTINGS ============
            let settingsTab = "general"; // "general" or "preferences"

            function setSettingsTab(tab) {
                vibrate(30);
                settingsTab = tab;
                renderSettings();
                window.scrollTo({ top: 0 });
            }

            function renderSettings() {
                const p = document.getElementById("page-settings");
                const tabs = `
                    <div class="settings-tabs">
                        <button class="filter-chip ${settingsTab === "general" ? "active" : ""}" onclick="setSettingsTab('general')">General</button>
                        <button class="filter-chip ${settingsTab === "preferences" ? "active" : ""}" onclick="setSettingsTab('preferences')">Preferences</button>
                    </div>`;
                if (settingsTab === "preferences") {
                    p.innerHTML = tabs + profileSettingsHTML() + preferencesSettingsHTML() + `<div style="height:40px"></div>`;
                    return;
                }
                p.innerHTML = tabs + `
                    <div class="section-eyebrow">Exchange rates · Zitouna</div>
                    <div class="setting-row">
                        <div class="info">
                            <div class="info-label">Dollars (USD)</div>
                            <div class="info-sub">Current selling rate</div>
                        </div>
                        <input type="number" step="0.0001" id="s-usd" value="${state.taux.usd_vente}">
                    </div>
                    <div class="setting-row">
                        <div class="info">
                            <div class="info-label">Euros (EUR)</div>
                            <div class="info-sub">Current selling rate</div>
                        </div>
                        <input type="number" step="0.0001" id="s-eur" value="${state.taux.eur_vente}">
                    </div>
                    <div class="setting-row">
                        <div class="info">
                            <div class="info-label">Official source</div>
                            <div class="info-sub">Update once a week</div>
                        </div>
                        <a href="https://www.dinartunisien.com/fr/banque/zitouna" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-size:13px">Open ↗</a>
                    </div>

                    <div class="section-eyebrow">Account</div>
                    <div class="setting-row" style="cursor:default">
                        <div class="info">
                            <div class="info-label">${escapeHtml(currentUser?.email || "—")}</div>
                            <div class="info-sub">Only you can see your data</div>
                        </div>
                        <span style="color:var(--text-4);font-size:12px">🔒</span>
                    </div>
                    <button class="setting-row" onclick="openUsernameEditor(false)">
                        <div class="info">
                            <div class="info-label">Username</div>
                            <div class="info-sub">${escapeHtml(getUsername() || "Not set")}</div>
                        </div>
                        <span class="arrow">›</span>
                    </button>
                    <button class="setting-row" onclick="showAuth('setpassword')">
                        <div class="info">
                            <div class="info-label">Change password</div>
                        </div>
                        <span class="arrow">›</span>
                    </button>
                    <button class="setting-row" onclick="signOut()">
                        <div class="info">
                            <div class="info-label">Sign out</div>
                        </div>
                        <span class="arrow">›</span>
                    </button>
                    <a class="setting-row" href="privacy.html" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">
                        <div class="info">
                            <div class="info-label">Privacy policy</div>
                        </div>
                        <span class="arrow">↗</span>
                    </a>


                    <div class="section-eyebrow">Your data</div>
                    <button class="setting-row" onclick="exportExcel()">
                        <div class="info">
                            <div class="info-label">Export to Excel</div>
                            <div class="info-sub">Plain tables: everything, expenses, income, savings and cards (.xlsx)</div>
                        </div>
                        <span class="arrow" style="color:var(--accent)">↓</span>
                    </button>
                    <button class="setting-row" onclick="exportData()">
                        <div class="info">
                            <div class="info-label">Export as JSON</div>
                            <div class="info-sub">Raw backup file</div>
                        </div>
                        <span class="arrow" style="color:var(--accent)">↓</span>
                    </button>
                    <button class="setting-row" onclick="forceSync()">
                        <div class="info">
                            <div class="info-label">Force sync</div>
                            <div class="info-sub">Reload from Supabase</div>
                        </div>
                        <span class="arrow" style="color:var(--accent)">↻</span>
                    </button>

                    <div class="section-eyebrow">Backup</div>
                    ${backupSettingsHTML()}

                    <div class="section-eyebrow">Danger zone</div>
                    <button class="setting-row" onclick="resetAll()" style="border-color:rgba(217, 117, 88, 0.3)">
                        <div class="info">
                            <div class="info-label" style="color:var(--danger)">Erase all my entries</div>
                            <div class="info-sub">Keeps the account, deletes every expense, income and card operation</div>
                        </div>
                        <span class="arrow" style="color:var(--danger)">×</span>
                    </button>
                    <button class="setting-row" onclick="deleteAccount()" style="border-color:rgba(217, 117, 88, 0.3)">
                        <div class="info">
                            <div class="info-label" style="color:var(--danger)">Delete my account</div>
                            <div class="info-sub">Deletes the account and all its data. Cannot be undone.</div>
                        </div>
                        <span class="arrow" style="color:var(--danger)">×</span>
                    </button>

                    <div style="text-align:center;padding:40px 0 20px;font-size:11px;color:var(--text-4);letter-spacing:0.15em;">
                        Carnet · v2.0
                    </div>
                `;
                const usdIn = document.getElementById("s-usd");
                const eurIn = document.getElementById("s-eur");
                usdIn.onchange = (e) => {
                    vibrate(35);
                    state.taux.usd_vente = parseFloat(e.target.value);
                    pushTaux();
                    toast("USD rate updated");
                };
                eurIn.onchange = (e) => {
                    vibrate(35);
                    state.taux.eur_vente = parseFloat(e.target.value);
                    pushTaux();
                    toast("EUR rate updated");
                };
            }

            const byDate = (a, b) => (a.date || "").localeCompare(b.date || "");
            const round2 = (n) => Math.round(n * 1000) / 1000;

            function exportExcel(fileBase) {
                vibrate(35);
                if (typeof XLSX === "undefined") {
                    toast("Excel library not loaded yet, try again", true);
                    return;
                }
                // Plain data only: one row per entry, a header row, real dates and numbers. No summary, no styling.
                const isSaving = (d) => d.category === "Epargne";
                const spent = [...state.depenses].filter((d) => !isSaving(d)).sort(byDate);
                const savings = [...state.depenses].filter(isSaving).sort(byDate);
                const income = [...state.revenus].sort(byDate);
                const cardOps = [...state.carte].sort(byDate);
                const cardCat = (c) => (c.type === "Achat" ? catLabel(c.category || "Autre") : "");
                const original = (c) => (c.currency === "USD" ? c.usd : c.currency === "EUR" ? c.eur : round2(c.total_dt));

                const sheets = {
                    // Everything in one table, oldest first. Amounts as recorded; filter on Type or Account.
                    All: [
                        ["Date", "Type", "Account", "Name", "Category", "Amount (DT)"],
                        ...[
                            ...spent.map((d) => [d.date, "Expense", "Cash", d.description || "", catLabel(d.category), round2(d.amount)]),
                            ...income.map((r) => [r.date, "Income", "Cash", r.source || "", "", round2(r.amount)]),
                            ...savings.map((d) => [d.date, d.amount < 0 ? "Savings withdrawal" : "Savings deposit", "Savings", d.description || "", "", round2(d.amount)]),
                            ...cardOps.map((c) => [c.date, "Card " + (CARD_OP_LABELS[c.type] || c.type).toLowerCase(), cardName(c.card), c.description || "", cardCat(c), round2(c.total_dt)]),
                        ].sort((a, b) => (a[0] || "").localeCompare(b[0] || "")),
                    ],
                    Expenses: [["Date", "Name", "Category", "Amount (DT)"], ...spent.map((d) => [d.date, d.description || "", catLabel(d.category), round2(d.amount)])],
                    Income: [["Date", "Name", "Amount (DT)"], ...income.map((r) => [r.date, r.source || "", round2(r.amount)])],
                    Savings: [["Date", "Name", "Movement", "Amount (DT)"], ...savings.map((d) => [d.date, d.description || "", d.amount < 0 ? "Withdrawal" : "Deposit", round2(d.amount)])],
                    Cards: [
                        ["Date", "Card", "Name", "Type", "Category", "Currency", "Original amount", "Rate", "Amount (DT)"],
                        ...cardOps.map((c) => [c.date, cardName(c.card), c.description || "", CARD_OP_LABELS[c.type] || c.type, cardCat(c), c.currency || "TND", original(c), c.rate || "", round2(c.total_dt)]),
                    ],
                };

                // "YYYY-MM-DD" → a real Excel date (serial number shown as yyyy-mm-dd), so sorting and filtering work
                const excelDate = (iso) => {
                    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
                    return m ? (Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30)) / 86400000 : null;
                };

                const wb = XLSX.utils.book_new();
                Object.entries(sheets).forEach(([name, rows]) => {
                    const ws = XLSX.utils.aoa_to_sheet(rows.map((r, i) => (i ? r.map((v) => (v == null ? "" : v)) : r)));
                    for (let i = 1; i < rows.length; i++) {
                        const ref = XLSX.utils.encode_cell({ r: i, c: 0 });
                        const serial = excelDate(rows[i][0]);
                        ws[ref] = serial == null ? { t: "s", v: "" } : { t: "n", v: serial, z: "yyyy-mm-dd" };
                    }
                    // column widths from the longest value, header row filterable
                    ws["!cols"] = rows[0].map((_, c) => ({ wch: Math.min(48, Math.max(10, ...rows.map((r) => String(r[c] ?? "").length + 2))) }));
                    ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(0, rows.length - 1), c: rows[0].length - 1 } }) };
                    XLSX.utils.book_append_sheet(wb, ws, name);
                });
                XLSX.writeFile(wb, (typeof fileBase === "string" ? fileBase : "carnet-" + new Date().toISOString().slice(0, 10)) + ".xlsx");
                toast("Excel file exported");
            }

            function exportData(fileBase) {
                vibrate(35);
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = (typeof fileBase === "string" ? fileBase : "carnet-" + new Date().toISOString().slice(0, 10)) + ".json";
                a.click();
                URL.revokeObjectURL(url);
                toast("Exported");
            }

            async function forceSync() {
                vibrate(40);
                document.getElementById("loading").style.display = "flex";
                await bootstrap();
                document.getElementById("loading").style.display = "none";
                render();
                toast("Synced");
            }

            async function resetAll() {
                vibrate(50);
                if (!confirm("Erase all your entries? Your account stays.\n\nTip: export to Excel first.")) return;
                if (prompt("Type ERASE to delete every entry of " + (currentUser?.email || "this account")) !== "ERASE") return toast("Cancelled");
                setSync("syncing", "Erasing…");
                try {
                    // Only ever this user's rows (explicit filter on top of RLS)
                    const uid = currentUser?.id;
                    if (!uid) throw new Error("not signed in");
                    for (const t of ["depenses", "revenus", "carte"]) {
                        const { error } = await sb.from(t).delete().eq("user_id", uid);
                        if (error) throw error;
                    }
                    state.depenses = [];
                    state.revenus = [];
                    state.carte = [];
                    render();
                    setSync("", "Up to date");
                    toast("Everything erased");
                } catch (e) {
                    setSync("error", "Error");
                    toast("Error", true);
                }
            }

            // ============ MOTION (motion.dev) ============
            // Springs for every button, row and card; sheets, pages and toasts.
            // If the library failed to load, everything still works, just without the motion.
            const SNAP = { type: "spring", stiffness: 600, damping: 32 }; // press down
            const SETTLE = { type: "spring", stiffness: 420, damping: 15 }; // release: a small bounce
            const GLIDE = { type: "spring", stiffness: 300, damping: 26 }; // hover, pages

            function mo(el, keyframes, options) {
                const M = window.Motion;
                if (!M || !el) return Promise.resolve();
                return M.animate(el, keyframes, options);
            }

            // What reacts, and how: "pop" grows (icons, chips), "lift" rises (rows, cards, big buttons)
            const PRESSABLE = "button, a.setting-row, .list-item, .solde-card, .goal-card";
            const POP = ".icon-btn, .pen-btn, .filter-chip, .tab, .cat-btn, .swatch, .theme-opt, .seg-toggle button, .fab, .style-opt, .topbar-hello";
            const NO_MOTION = ".welcome-go, .welcome-go *, #welcome, .auth-links button";

            function motionTarget(e) {
                const el = e.target.closest && e.target.closest(PRESSABLE);
                if (!el || el.matches(NO_MOTION) || el.disabled) return null;
                return el;
            }

            function restState(el) {
                const pop = el.matches(POP);
                return el.matches(":hover") && matchMedia("(hover: hover)").matches ? (pop ? { scale: 1.06, y: 0, rotate: 0 } : { scale: 1, y: -2, rotate: 0 }) : { scale: 1, y: 0, rotate: 0 };
            }

            function settle(el) {
                const target = restState(el);
                mo(el, target, SETTLE).then(() => {
                    // back at rest: hand the transform back to the stylesheet
                    if (target.scale === 1 && target.y === 0 && !el.matches(":hover")) el.style.transform = "";
                });
            }

            function initMotionUI() {
                if (!window.Motion) return console.warn("Motion did not load: animations are off");
                // Press: a quick squeeze, then a springy release
                document.addEventListener(
                    "pointerdown",
                    (e) => {
                        const el = motionTarget(e);
                        if (!el) return;
                        const pop = el.matches(POP);
                        const big = el.offsetWidth > 220;
                        mo(el, el.matches(".fab") ? { scale: 0.88, rotate: 45 } : { scale: pop ? 0.9 : big ? 0.98 : 0.95 }, SNAP);
                        const up = () => {
                            settle(el);
                            removeEventListener("pointerup", up);
                            removeEventListener("pointercancel", up);
                        };
                        addEventListener("pointerup", up);
                        addEventListener("pointercancel", up);
                    },
                    { passive: true },
                );
                // Hover (mouse only): icons grow a little, rows and cards rise
                document.addEventListener("pointerover", (e) => {
                    if (e.pointerType !== "mouse") return;
                    const el = motionTarget(e);
                    if (!el || el.contains(e.relatedTarget)) return;
                    mo(el, el.matches(POP) ? { scale: 1.06 } : { y: -2 }, GLIDE);
                });
                document.addEventListener("pointerout", (e) => {
                    if (e.pointerType !== "mouse") return;
                    const el = motionTarget(e);
                    if (!el || el.contains(e.relatedTarget)) return;
                    mo(el, { scale: 1, y: 0, rotate: 0 }, GLIDE).then(() => {
                        if (!el.matches(":hover")) el.style.transform = "";
                    });
                });
                // Sheets: spring up when opened, their content following in a short cascade
                document.querySelectorAll(".modal-backdrop").forEach((bd) => {
                    let wasOpen = bd.classList.contains("open");
                    new MutationObserver(() => {
                        const open = bd.classList.contains("open");
                        const sheet = bd.querySelector(".modal");
                        if (open && !wasOpen) sheetIn(sheet);
                        if (!open && wasOpen && sheet) {
                            // closing: stop the spring and give the slide-down back to the CSS transition
                            sheet._anim?.stop();
                            sheet.style.transform = "";
                            sheet.style.transition = "";
                        }
                        wasOpen = open;
                    }).observe(bd, { attributes: true, attributeFilter: ["class"] });
                });
            }

            function sheetIn(sheet) {
                if (!sheet) return;
                sheet.style.transition = "none"; // the spring replaces the CSS slide
                sheet._anim = window.Motion.animate(sheet, { y: ["100%", "0%"] }, { type: "spring", stiffness: 340, damping: 32 });
                const kids = [...sheet.children].filter((c) => c.offsetParent !== null).slice(0, 10);
                mo(kids, { opacity: [0, 1], y: [14, 0] }, { ...GLIDE, delay: window.Motion?.stagger(0.035, { startDelay: 0.08 }) });
            }

            // Page change: the page's blocks arrive one after the other
            function pageIn(name) {
                const page = document.getElementById("page-" + name);
                const kids = [...(page?.children || [])].slice(0, 10);
                if (!kids.length) return;
                mo(kids, { opacity: [0, 1], y: [16, 0] }, { ...GLIDE, delay: window.Motion?.stagger(0.04) }).then(() => kids.forEach((k) => (k.style.transform = "")));
            }

            // ============ TOAST ============
            function toast(msg, isError = false) {
                const el = document.getElementById("toast");
                el.className = "toast" + (isError ? " error" : "");
                document.getElementById("toast-text").textContent = msg;
                document.querySelector(".toast-icon").textContent = isError ? "!" : "✓";
                const hidden = parseFloat(getComputedStyle(el).opacity) < 0.05;
                if (window.Motion) mo(el, hidden ? { opacity: [0, 1], y: [18, 0], scale: [0.9, 1] } : { opacity: 1, y: 0, scale: 1 }, { type: "spring", stiffness: 500, damping: 22 });
                else el.style.opacity = 1;
                clearTimeout(el._t);
                el._t = setTimeout(() => {
                    if (window.Motion) mo(el, { opacity: 0, y: 14, scale: 0.94 }, { duration: 0.22, ease: "easeIn" });
                    else el.style.opacity = 0;
                }, 2000);
            }

            // ============ INIT ============
            // Motion is loaded with defer: it is ready by DOMContentLoaded
            document.addEventListener("DOMContentLoaded", initMotionUI);
            loadCachedPrefs();
            initAuth();
            document.getElementById("modal-backdrop").addEventListener("click", (e) => {
                if (e.target.id === "modal-backdrop") closeModal();
            });
            document.getElementById("backup-modal-backdrop").addEventListener("click", (e) => {
                if (e.target.id === "backup-modal-backdrop") closeBackupMenu();
            });
            document.getElementById("username-modal-backdrop").addEventListener("click", (e) => {
                if (e.target.id === "username-modal-backdrop") closeUsernameEditor();
            });
            document.getElementById("username-input").addEventListener("keydown", (e) => {
                if (e.key === "Enter") saveUsername();
            });
            document.getElementById("cat-modal-backdrop").addEventListener("click", (e) => {
                if (e.target.id === "cat-modal-backdrop") closeCategoryEditor();
            });
            document.getElementById("goal-modal-backdrop").addEventListener("click", (e) => {
                if (e.target.id === "goal-modal-backdrop") closeGoalEditor();
            });
            document.getElementById("card-modal-backdrop").addEventListener("click", (e) => {
                if (e.target.id === "card-modal-backdrop") closeCardEditor();
            });
            document.querySelectorAll("#card-style-grid .style-opt").forEach((b) => {
                b.onclick = () => {
                    vibrate(30);
                    if (b.dataset.style === "custom" && !cardDraftImage) document.getElementById("card-file").click();
                    setCardStyle(b.dataset.style);
                };
            });

            const fab = document.querySelector(".fab");
            if (fab) {
                const orig = fab.onclick;
                fab.onclick = function (e) {
                    vibrate(45);
                    if (orig) orig.call(this, e);
                };
            }
            const settingsBtn = document.getElementById("settings-btn");
            if (settingsBtn) {
                const orig = settingsBtn.onclick;
                settingsBtn.onclick = function (e) {
                    vibrate(35);
                    if (orig) orig.call(this, e);
                };
            }
            
        </script>
    </body>
