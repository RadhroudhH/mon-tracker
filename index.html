                    <button class="btn btn-primary" onclick="saveCategory()">Save</button>
                </div>
                <div class="btn-row" id="cat-delete-row" style="display: none; margin-top: 8px">
                    <button class="btn btn-danger" onclick="deleteCategory()">Delete category</button>
                </div>
            </div>
        </div>

        <!-- Goal editor -->
        <div class="modal-backdrop" id="goal-modal-backdrop">
            <div class="modal">
                <div class="modal-handle"></div>
                <h2 id="goal-modal-title">New goal</h2>
                <div class="field">
                    <label for="goal-name">Name</label>
                    <input type="text" id="goal-name" maxlength="60" placeholder="New phone, Summer trip, Emergency fund…" />
                </div>
                <div class="field">
                    <label for="goal-target">Target amount (DT)</label>
                    <input type="number" id="goal-target" step="1" min="1" placeholder="1200" inputmode="decimal" />
                </div>
                <div class="field">
                    <label for="goal-date">Target date (optional)</label>
                    <input type="date" id="goal-date" />
                </div>
                <div class="field">
                    <label for="goal-scope">What counts toward it</label>
                    <select id="goal-scope" onchange="onGoalScopeChange()">
                        <option value="savings">My savings</option>
                        <option value="total">My total balance</option>
                        <option value="card">A card's balance</option>
                    </select>
                </div>
                <div class="field" id="goal-card-field" style="display: none">
                    <label for="goal-card">Which card?</label>
                    <select id="goal-card"></select>
                </div>
                <div class="btn-row">
                    <button class="btn btn-ghost" onclick="closeGoalEditor()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveGoal()">Save</button>
                </div>
                <div class="btn-row" id="goal-delete-row" style="display: none; margin-top: 8px">
                    <button class="btn btn-danger" onclick="deleteGoal()">Delete goal</button>
                </div>
            </div>
        </div>

        <!-- Card editor -->
        <div class="modal-backdrop" id="card-modal-backdrop">
            <div class="modal">
                <div class="modal-handle"></div>
                <h2 id="card-modal-title">New card</h2>

                <div class="card-preview" id="card-preview"></div>

                <div class="field">
                    <label for="card-name">Name</label>
                    <input type="text" id="card-name" maxlength="60" placeholder="My bank card, D17, Revolut…" oninput="updateCardPreview()" />
                </div>

                <div class="field" id="card-color-field">
                    <label>Color on the dashboard</label>
                    <div class="swatches" id="card-colors"></div>
                </div>

                <div class="field">
                    <label>Look</label>
                    <div class="style-grid" id="card-style-grid">
                        <button type="button" class="style-opt" data-style="default"><div class="style-thumb"><div class="card-default"><img src="images/logo.png" alt="" /></div></div>Carnet</button>
                        <button type="button" class="style-opt" data-style="techno"><div class="style-thumb"><img src="images/techno.png" alt="" /></div>Techno</button>
                        <button type="button" class="style-opt" data-style="d17"><div class="style-thumb"><img src="images/d17.png" alt="" /></div>D17</button>
                        <button type="button" class="style-opt" data-style="custom"><div class="style-thumb"><span>⇪</span></div>My image</button>
                    </div>
                </div>

                <div class="field" id="card-upload-field" style="display: none">
                    <label for="card-file">Your image</label>
                    <input type="file" id="card-file" accept="image/*" onchange="onCardFile(this)" />
                    <div style="font-size: 11px; color: var(--text-3); margin-top: 8px">Tip: don't use a photo that shows your full card number.</div>
                </div>

                <div class="field">
                    <label class="check-row" style="letter-spacing: normal; text-transform: none; font-size: 14px; color: var(--text-2); margin: 0">
                        <input type="checkbox" id="card-fx" onchange="onCardFxChange()" />
                        Can pay in foreign currency (USD / EUR)
                    </label>
                </div>

                <div class="field" id="card-fx-limit-field" style="display: none">
                    <label for="card-fx-limit">Annual foreign-currency limit (DT, optional)</label>
                    <input type="number" id="card-fx-limit" step="1" min="0" placeholder="e.g. 1000" inputmode="decimal" />
                </div>

                <div class="btn-row">
                    <button class="btn btn-ghost" onclick="closeCardEditor()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveCard()">Save</button>
                </div>
                <div class="btn-row" id="card-delete-row" style="display: none; margin-top: 8px">
                    <button class="btn btn-danger" onclick="deleteCard()">Delete card</button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast">
            <div class="toast-icon">✓</div>
            <span id="toast-text">Saved</span>
        </div>

        <script>
            // ============ SUPABASE CONFIG ============
            const SUPABASE_URL = "https://sopwocrilelcxitpqvem.supabase.co";
            // This key is public by design. Security comes from Row Level Security in the database

            const SUPABASE_KEY = "sb_publishable_MUndTwbVREQR4eO6_PAj8Q_MkOz15_t";

            // ============ VIBRATION ============
            function vibrate(ms) {

            const PERIODS = [

            let state = { depenses: [], revenus: [], carte: [], cards: [], categories: [], goals: [], taux: { usd_vente: 3.025, eur_vente: 3.426 }, activeCard: null };

            // ============ FORMATTERS ============
            const fmt = (n) => {

            // ============ AUTH ============
            // Modes: signin, signup, forgot (send reset email), setpassword (after an invite or reset link)
            let authMode = "signin";
            let appStarted = false;

            const AUTH_TEXT = {

            function showAuth(mode, msg, isError) {

            function hideAuth() {

            function setAuthMsg(msg, isError) {
                const m = document.getElementById("auth-msg");

            // Where Supabase email links (confirm, reset, invite) send people back to
            const APP_URL = location.origin + location.pathname;

            async function onAuthSubmit(e) {
                e.preventDefault();
                const email = document.getElementById("auth-email").value.trim();
                const password = document.getElementById("auth-password").value;
                const btn = document.getElementById("auth-submit");

                if (authMode !== "setpassword" && !/^\S+@\S+\.\S+$/.test(email)) return setAuthMsg("Enter a valid email.", true);
                if (authMode !== "forgot" && password.length < 8) return setAuthMsg("Password must be at least 8 characters.", true);
                const username = cleanUsername(document.getElementById("auth-username").value);
                if (authMode === "signup" && username.length < 2) return setAuthMsg("Choose a username (at least 2 characters).", true);
                if (authMode === "signup" && !document.getElementById("auth-consent-box").checked) return setAuthMsg("Please accept the privacy policy to continue.", true);

                btn.disabled = true;
                try {
                    if (authMode === "signin") {
                        const { error } = await sb.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        // onAuthStateChange starts the app
                    } else if (authMode === "signup") {
                        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: APP_URL, data: { username } } });
                        if (error) throw error;
                        if (!data.session) showAuth("signin", "Check your inbox and click the confirmation link, then sign in here.");
                    } else if (authMode === "forgot") {
                        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: APP_URL });
                        if (error) throw error;
                        showAuth("signin", "If an account exists for this email, a reset link is on its way.");
                    } else if (authMode === "setpassword") {
                        const { error } = await sb.auth.updateUser({ password });
                        if (error) throw error;
                        history.replaceState(null, "", APP_URL);
                        toast("Password saved");
                        if (appStarted) hideAuth();
                        else await startApp();
                    }
                } catch (err) {
                    setAuthMsg(friendlyAuthError(err), true);
                } finally {
                    btn.disabled = false;
                }
            }

            function friendlyAuthError(err) {
                const m = (err && err.message) || "";
                if (/invalid login credentials/i.test(m)) return "Wrong email or password.";
                if (/email not confirmed/i.test(m)) return "Please confirm your email first (check your inbox).";
                if (/signups not allowed|signup is disabled/i.test(m)) return "Sign-ups are closed. Ask the owner for an invitation.";
                if (/already registered/i.test(m)) return "This email already has an account. Sign in instead.";
                if (/rate limit/i.test(m)) return "Too many attempts. Wait a minute and try again.";
                return m || "Something went wrong. Try again.";
            }

            async function startApp() {
                if (appStarted) return;
                appStarted = true;
                const { data } = await sb.auth.getUser();
                currentUser = data.user;
                const lock = document.getElementById("lock");
                if (lock.style.display !== "none") {
                    lock.style.animation = "fadeOut 0.4s var(--ease) forwards";
                    setTimeout(() => (lock.style.display = "none"), 400);

                document.getElementById("loading").style.display = "flex";
                await bootstrap();
                document.getElementById("loading").style.display = "none";
                document.getElementById("app").classList.add("show");
                render();
                initSwipe();
                // Accounts made before usernames existed pick one first, then get the welcome
                updateHello();

                else if (prefs.greeting) playWelcome();
            }

            function updateHello() {
                const n = getUsername();
                document.getElementById("topbar-name").textContent = n ? ", " + n : "";
            }

            // ----- Username (stored in the account's user_metadata, no table needed) -----
            const cleanUsername = (s) => (s || "").replace(/\s+/g, " ").trim().slice(0, 24);
            const getUsername = () => cleanUsername(currentUser?.user_metadata?.username);
            let usernameFirstTime = false;

            function openUsernameEditor(firstTime) {
                usernameFirstTime = !!firstTime;
                document.getElementById("username-modal-title").textContent = firstTime ? "Choose a username" : "Change username";
                document.getElementById("username-cancel").style.display = firstTime ? "none" : "";

            }

            function closeUsernameEditor() {
                if (usernameFirstTime) return; // a username is required once

            }

            async function saveUsername() {
                const username = cleanUsername(document.getElementById("username-input").value);
                if (username.length < 2) return toast("At least 2 characters", true);
                const { data, error } = await sb.auth.updateUser({ data: { username } });

                currentUser = data.user;
                const wasFirst = usernameFirstTime;
                usernameFirstTime = false;
                closeUsernameEditor();
                updateHello();
                if (currentPage === "settings") renderSettings();
                if (wasFirst && prefs.greeting) setTimeout(playWelcome, 350);
                else if (!wasFirst) toast("Username saved");
            }

            // ----- Welcome: "Welcome" fades in and out (0.5 s each), then the username in the accent color,
            // then a "Go to Carnet" button one second later -----
            let welcomeBusy = false;
            function playWelcome() {
                const el = document.getElementById("welcome");
                document.getElementById("welcome-name").textContent = getUsername();
                el.style.cssText = "";
                el.classList.remove("play", "leave", "skip");
                void el.offsetWidth; // restart the animation
                el.classList.add("show", "play");
                welcomeBusy = false;
            }

            // Tap on the background: skip ahead to the name and the button, fading smoothly from wherever they were
            function skipWelcome(e) {
                const el = document.getElementById("welcome");
                if (e.target.closest(".welcome-go") || welcomeBusy || el.classList.contains("skip") || !el.classList.contains("play")) return;
                const parts = [".welcome-word", ".welcome-name", ".welcome-go"].map((s) => el.querySelector(s));
                const from = parts.map((p) => {
                    const cs = getComputedStyle(p);
                    return { opacity: cs.opacity, transform: cs.transform };
                });
                el.classList.add("skip");
                parts.forEach((p, i) => {
                    const cs = getComputedStyle(p);
                    p.animate([from[i], { opacity: cs.opacity, transform: cs.transform }], { duration: 400, easing: "cubic-bezier(.22,1,.36,1)" });
                });
            }

            function endWelcome() {
                const el = document.getElementById("welcome");
                el.classList.add("leave");
                setTimeout(() => closeWelcome(), 500);
            }

            function closeWelcome() {
                const el = document.getElementById("welcome");
                el.classList.remove("show", "play", "leave", "skip");
                el.style.cssText = "";
                // drop what the transitions left on the welcome screen (but not its own CSS animations)
                el.getAnimations({ subtree: true }).forEach((a) => typeof CSSAnimation !== "undefined" && a instanceof CSSAnimation ? null : a.cancel());
                welcomeBusy = false;
            }

            function goToCarnet(e) {
                if (welcomeBusy) return;
                welcomeBusy = true;
                vibrate(40);
                // the switches in Settings → Preferences → Animations decide (not the OS motion setting)
                if (!prefs.transition) return endWelcome();
                const r = e.currentTarget.getBoundingClientRect();
                const o = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
                // a different transition every time
                const names = Object.keys(TRANSITIONS);
                let last = null;
                try {
                    last = localStorage.getItem("carnet-last-fx");
                } catch (_) {}
                const pool = names.filter((n) => n !== last);
                const pick = pool[Math.floor(Math.random() * pool.length)];
                try {
                    localStorage.setItem("carnet-last-fx", pick);
                } catch (_) {}
                const layer = document.createElement("div");
                layer.className = "fx-layer";
                document.body.appendChild(layer);
                const done = (ms) =>
                    setTimeout(() => {
                        layer.remove();
                        closeWelcome();
                    }, ms);
                TRANSITIONS[pick](layer, o, done);
            }

            // ----- Transition helpers -----
            const rand = (a, b) => a + Math.random() * (b - a);
            const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
            const fxColors = () => [cssVar("--accent"), cssVar("--accent-2"), ...PALETTE];

            // The dashboard arrives: the app settles into place, then each section pops in one after the other
            // Phones get lighter effects (fewer particles, 1x canvas): smoothness beats detail there
            const LITE = matchMedia("(pointer: coarse)").matches || innerWidth < 700;

            // Only transform and opacity move here (GPU work). Animating blur on the whole page made phones stutter.
            function enterApp(delay, from) {
                const app = document.getElementById("app");
                app.classList.add("entering");
                // zoom around the middle of the screen, not the middle of the (tall) page
                app.style.transformOrigin = `50% ${scrollY + innerHeight / 2}px`;
                const anim = app.animate([from || { transform: "scale(1.08)", opacity: 0.15 }, { transform: "none", opacity: 1 }], { duration: 900, delay, easing: "cubic-bezier(.22,1,.36,1)", fill: "backwards" });
                const clear = () => {
                    app.classList.remove("entering");
                    app.style.transformOrigin = "";
                };
                anim.finished.then(clear, clear);
                const page = document.getElementById("page-" + currentPage);
                const kids = [...(page?.children || [])].slice(0, 8);
                if (window.Motion) {
                    kids.forEach((k) => (k.style.opacity = 0)); // hidden until their turn
                    mo(kids, { opacity: [0, 1], y: [26, 0], scale: [0.96, 1] }, { type: "spring", stiffness: 260, damping: 16, delay: window.Motion.stagger(0.08, { startDelay: (delay + 250) / 1000 }) }).then(() =>
                        kids.forEach((k) => (k.style.transform = "")),
                    );
                }
            }

            // Fade the words and the button out from wherever their own animation left them
            function fadeWelcomeText(w, to, duration) {
                w.querySelectorAll("div,button").forEach((n) => {
                    const cs = getComputedStyle(n);
                    const end = n.tagName === "BUTTON" && to.transform ? { ...to, transform: "translateX(-50%) " + to.transform } : to; // the button is centered with a translate
                    n.animate([{ opacity: cs.opacity, transform: cs.transform }, end], { duration, fill: "forwards", easing: "ease-in" });
                });
            }

            // A copy of the welcome screen, used as the material that breaks apart
            function welcomeClone(layer) {
                const src = document.getElementById("welcome");
                const c = src.cloneNode(true);
                c.removeAttribute("id");
                c.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
                c.classList.remove("play");
                c.style.position = "absolute";
                c.querySelector(".welcome-name").style.opacity = 1;
                c.querySelector(".welcome-go").style.opacity = 0;
                layer.appendChild(c);
                return c;
            }

            function fxCanvas(layer) {
                const cv = document.createElement("canvas");
                const dpr = LITE ? 1 : Math.min(2, devicePixelRatio || 1);
                cv.width = innerWidth * dpr;
                cv.height = innerHeight * dpr;
                cv.style.cssText = "position:absolute;inset:0;width:100%;height:100%";
                layer.appendChild(cv);
                const ctx = cv.getContext("2d");
                ctx.scale(dpr, dpr);
                return ctx;
            }

            function frames(ms, fn) {
                const t0 = performance.now();
                const step = (now) => {
                    const t = Math.min(1, (now - t0) / ms);
                    fn(t, now - t0);
                    if (t < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }

            const TRANSITIONS = {
                // Hyperspace: stars stretch into light streaks, a flash, and the dashboard rushes in
                warp(layer, o, done) {
                    const w = document.getElementById("welcome");
                    fadeWelcomeText(w, { opacity: 0, transform: "scale(1.6)" }, 450);
                    const ctx = fxCanvas(layer);
                    const W = innerWidth,
                        H = innerHeight,
                        cx = W / 2,
                        cy = H / 2,
                        bg = cssVar("--bg"),
                        cols = [cssVar("--accent"), cssVar("--accent-2"), "#ffffff"];
                    const stars = Array.from({ length: LITE ? 150 : 320 }, () => ({ a: rand(0, Math.PI * 2), d: rand(4, Math.max(W, H) * 0.5), c: cols[Math.floor(Math.random() * 3)], w: rand(0.6, 2.2) }));
                    let last = 0;
                    frames(1300, (t, el) => {
                        const dt = el - last;
                        last = el;
                        ctx.globalAlpha = 0.35;
                        ctx.fillStyle = bg;
                        ctx.fillRect(0, 0, W, H);
                        ctx.globalAlpha = 1;
                        const speed = 0.02 + t * t * 2.6;
                        stars.forEach((s) => {
                            const d0 = s.d;
                            s.d += s.d * speed * dt * 0.06 + 0.4;
                            ctx.strokeStyle = s.c;
                            ctx.lineWidth = s.w * (1 + t * 2);
                            ctx.beginPath();
                            ctx.moveTo(cx + Math.cos(s.a) * d0, cy + Math.sin(s.a) * d0);
                            ctx.lineTo(cx + Math.cos(s.a) * s.d, cy + Math.sin(s.a) * s.d);
                            ctx.stroke();
                            if (s.d > Math.max(W, H)) s.d = rand(2, 30);
                        });
                    });
                    const flash = document.createElement("div");
                    flash.style.cssText = `position:absolute;inset:0;background:radial-gradient(circle, #fff, ${cssVar("--accent")} 45%, transparent 75%)`;
                    layer.appendChild(flash);
                    flash.animate([{ opacity: 0 }, { opacity: 0, offset: 0.72 }, { opacity: 1, offset: 0.82 }, { opacity: 0 }], { duration: 1700, fill: "forwards" });
                    layer.animate([{ opacity: 1 }, { opacity: 1, offset: 0.75 }, { opacity: 0 }], { duration: 1700, fill: "forwards" });
                    setTimeout(() => (w.style.opacity = 0), 1250);
                    enterApp(1250, { transform: "scale(1.5)", opacity: 0 });
                    done(1750);
                },

                // Shatter: the welcome screen cracks into glass shards that explode away from the button
                shatter(layer, o, done) {
                    const w = document.getElementById("welcome");
                    // Each shard is a small element of its own size (not a full-screen copy), so phones only move small tiles
                    const W = innerWidth,
                        H = innerHeight,
                        cols = LITE ? 4 : 6,
                        rows = LITE ? 7 : 9,
                        cw = W / cols,
                        rh = H / rows;
                    const name = w.querySelector(".welcome-name");
                    const nr = name.getBoundingClientRect();
                    const ncs = getComputedStyle(name);
                    const bg = cssVar("--bg"),
                        ac = cssVar("--accent");
                    for (let i = 0; i < cols; i++)
                        for (let j = 0; j < rows; j++)
                            for (let k = 0; k < 2; k++) {
                                const x = i * cw,
                                    y = j * rh;
                                const s = document.createElement("div");
                                // each shard catches the light a little differently, so the glass reads as pieces
                                s.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${cw + 1}px;height:${rh + 1}px;overflow:hidden;clip-path:polygon(${k ? "0 0,100% 0,100% 100%" : "0 0,0 100%,100% 100%"});background:linear-gradient(${rand(0, 360)}deg, color-mix(in srgb, ${ac} ${rand(6, 26)}%, ${bg}), ${bg} 70%)`;
                                // the piece of the name that was under this shard breaks away with it
                                if (x < nr.right && x + cw > nr.left && y < nr.bottom && y + rh > nr.top) {
                                    const t = document.createElement("div");
                                    t.textContent = name.textContent;
                                    t.style.cssText = `position:absolute;left:${nr.left - x}px;top:${nr.top - y}px;width:${nr.width}px;height:${nr.height}px;font:${ncs.font};font-style:${ncs.fontStyle};letter-spacing:${ncs.letterSpacing};color:${ncs.color};text-align:center;white-space:nowrap`;
                                    s.appendChild(t);
                                }
                                layer.appendChild(s);
                                const dx = x + cw / 2 - o.x,
                                    dy = y + rh / 2 - o.y,
                                    dist = Math.hypot(dx, dy) || 1;
                                const push = rand(LITE ? 350 : 500, LITE ? 750 : 1100);
                                s.animate(
                                    [
                                        { transform: "none", opacity: 1 },
                                        { transform: `translate3d(${(dx / dist) * 6}px, ${(dy / dist) * 6}px, 0)`, opacity: 1, offset: 0.12 },
                                        { transform: `translate3d(${(dx / dist) * push}px, ${(dy / dist) * push + 300}px, ${rand(-400, 300)}px) rotate3d(${rand(-1, 1)}, ${rand(-1, 1)}, ${rand(-1, 1)}, ${rand(180, 540)}deg) scale(.5)`, opacity: 0 },
                                    ],
                                    { duration: rand(1000, 1500), delay: 120 + dist * 0.35, easing: "cubic-bezier(.3,.1,.3,1)", fill: "both" },
                                );
                            }
                    w.style.opacity = 0;
                    const crack = document.createElement("div");
                    crack.style.cssText = `position:absolute;inset:0;background:radial-gradient(circle at ${o.x}px ${o.y}px, #fff, ${cssVar("--accent-2")} 12%, transparent 40%)`;
                    layer.appendChild(crack);
                    crack.animate([{ opacity: 0.95 }, { opacity: 0 }], { duration: 450, easing: "ease-out", fill: "both" });
                    enterApp(250);
                    done(2000);
                },

                // Iris: a growing hole opens from the button, chased by shockwave rings and sparks
                iris(layer, o, done) {
                    const w = document.getElementById("welcome");
                    fadeWelcomeText(w, { opacity: 0, transform: "scale(.8)" }, 300);
                    const max = Math.hypot(Math.max(o.x, innerWidth - o.x), Math.max(o.y, innerHeight - o.y)) + 60;
                    // The veil moves to a canvas under the words, and the hole is cut there: one fill and one circle
                    // per frame, instead of re-masking the whole screen every frame
                    layer.style.zIndex = 299;
                    w.style.background = "transparent";
                    const ctx = fxCanvas(layer);
                    const bg = cssVar("--bg"),
                        ac = cssVar("--accent"),
                        ac2 = cssVar("--accent-2");
                    const cols = fxColors();
                    const outQuint = (x) => 1 - Math.pow(1 - x, 4);
                    // Rings and sparks are drawn on the same canvas (no glowing DOM elements scaled 20x)
                    const rings = [0, 140, 280].map((d, i) => ({ d, w: 3 - i, c: i === 1 ? ac2 : ac }));
                    const sparks = Array.from({ length: LITE ? 28 : 46 }, (_, i) => ({ a: rand(0, Math.PI * 2), d: rand(120, 480), dur: rand(700, 1300), sz: rand(1.5, 4), c: cols[i % cols.length] }));
                    frames(1350, (t, ms) => {
                        const e = Math.min(1, ms / 1100);
                        const hole = (e < 0.5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2) * max;
                        ctx.globalCompositeOperation = "source-over";
                        ctx.globalAlpha = 1;
                        ctx.clearRect(0, 0, innerWidth, innerHeight);
                        ctx.globalAlpha = 0.82;
                        ctx.fillStyle = bg;
                        ctx.fillRect(0, 0, innerWidth, innerHeight);
                        ctx.globalAlpha = 1;
                        ctx.globalCompositeOperation = "destination-out";
                        ctx.beginPath();
                        ctx.arc(o.x, o.y, hole, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalCompositeOperation = "source-over";
                        rings.forEach((r) => {
                            const p = Math.max(0, Math.min(1, (ms - r.d) / 1200));
                            if (p <= 0 || p >= 1) return;
                            const rad = outQuint(p) * max * 1.1;
                            ctx.strokeStyle = r.c;
                            ctx.globalAlpha = (1 - p) * 0.25; // soft glow: one wide faint stroke
                            ctx.lineWidth = r.w * 8;
                            ctx.beginPath();
                            ctx.arc(o.x, o.y, rad, 0, Math.PI * 2);
                            ctx.stroke();
                            ctx.globalAlpha = 1 - p;
                            ctx.lineWidth = r.w;
                            ctx.stroke();
                        });
                        sparks.forEach((s) => {
                            const p = Math.min(1, ms / s.dur);
                            if (p >= 1) return;
                            const dist = outQuint(p) * s.d;
                            ctx.fillStyle = s.c;
                            ctx.globalAlpha = 1 - p;
                            ctx.beginPath();
                            ctx.arc(o.x + Math.cos(s.a) * dist, o.y + Math.sin(s.a) * dist, s.sz * (1 - p * 0.7), 0, Math.PI * 2);
                            ctx.fill();
                        });
                    });
                    enterApp(150, { transform: "scale(.92)", opacity: 0.4 });
                    done(1450);
                },

                // Grand doors: a line of light splits the screen and two heavy doors swing open in 3D
                doors(layer, o, done) {
                    const w = document.getElementById("welcome");
                    const seam = document.createElement("div");
                    seam.style.cssText = `position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:${cssVar("--accent-2")};box-shadow:0 0 24px 6px ${cssVar("--accent")};z-index:2`;

                    const opts = { duration: 1300, delay: 380, easing: "cubic-bezier(.7,0,.25,1)", fill: "both" };
                    L.animate([{ transform: "none" }, { transform: "rotateY(-8deg)", offset: 0.15 }, { transform: "translateZ(80px) rotateY(105deg)", opacity: 0.2 }], opts);
                    R.animate([{ transform: "none" }, { transform: "rotateY(8deg)", offset: 0.15 }, { transform: "translateZ(80px) rotateY(-105deg)", opacity: 0.2 }], opts);
                    enterApp(450, { transform: "scale(.85)", opacity: 0 });
                    done(1750);
                },

                // Confetti cannon: a burst of colors from the button while the welcome screen flies up
                confetti(layer, o, done) {
                    const w = document.getElementById("welcome");
                    w.animate([{ transform: "none" }, { transform: "translateY(4%) scale(.98)", offset: 0.2 }, { transform: "translateY(-105%)" }], { duration: 900, delay: 120, easing: "cubic-bezier(.6,0,.3,1)", fill: "forwards" });
                    const ctx = fxCanvas(layer);
                    const cols = fxColors();
                    const bits = Array.from({ length: LITE ? 120 : 220 }, () => {
                        const a = rand(-Math.PI, 0),
                            v = rand(6, 19);
                        return { x: o.x, y: o.y, vx: Math.cos(a) * v * rand(0.4, 1.3), vy: Math.sin(a) * v, r: rand(0, 6), vr: rand(-0.3, 0.3), w: rand(5, 11), h: rand(3, 7), c: cols[Math.floor(Math.random() * cols.length)], round: Math.random() < 0.3 };
                    });
                    frames(2300, (t) => {
                        ctx.clearRect(0, 0, innerWidth, innerHeight);
                        ctx.globalAlpha = t > 0.75 ? (1 - t) / 0.25 : 1;
                        bits.forEach((b) => {
                            b.vy += 0.32;
                            b.vx *= 0.985;
                            b.x += b.vx;
                            b.y += b.vy;
                            b.r += b.vr;
                            ctx.save();
                            ctx.translate(b.x, b.y);
                            ctx.rotate(b.r);
                            ctx.scale(1, Math.cos(b.r * 2));
                            ctx.fillStyle = b.c;
                            if (b.round) {
                                ctx.beginPath();
                                ctx.arc(0, 0, b.h * 0.8, 0, Math.PI * 2);
                                ctx.fill();
                            } else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);

            // ============ SWIPE ============
            let swipeLeftEl = document.getElementById("swipe-left");
            let swipeRightEl = document.getElementById("swipe-right");

            function initSwipe() {
                const container = document.getElementById("page-container");
                if (!container) return;
                let touchStartX = 0,
                    touchStartY = 0,
                    isSwiping = false,
                    inScroller = false;
                container.addEventListener(
                    "touchstart",
                    function (e) {
                        // let the horizontal card list scroll instead of switching tabs
                        inScroller = !!e.target.closest(".card-selector");
                        const touch = e.touches[0];
                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                        isSwiping = false;
                        hideSwipeArrows();
                    },
                    { passive: true },
                );
                container.addEventListener(
                    "touchmove",
                    function (e) {
                        if (e.touches.length !== 1 || inScroller) return;
                        const touch = e.touches[0];
                        const dx = touch.clientX - touchStartX;
                        const dy = touch.clientY - touchStartY;
                        if (Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                            isSwiping = true;
                            e.preventDefault();
                            if (dx < 0 && canSwipeRight()) showSwipeArrow("right");
                            else if (dx > 0 && canSwipeLeft()) showSwipeArrow("left");
                            else hideSwipeArrows();
                        }
                    },
                    { passive: false },
                );
                container.addEventListener(
                    "touchend",
                    function (e) {
                        if (!isSwiping) return;
                        const touch = e.changedTouches[0];
                        const dx = touch.clientX - touchStartX;
                        const dy = touch.clientY - touchStartY;
                        hideSwipeArrows();
                        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                            if (dx < 0 && canSwipeRight()) {
                                vibrate(30);
                                navigateTab(1);
                            } else if (dx > 0 && canSwipeLeft()) {
                                vibrate(30);
                                navigateTab(-1);
                            }
                        }
                        isSwiping = false;
                    },
                    { passive: true },
                );
            }

            function canSwipeLeft() {
                const idx = TAB_ORDER.indexOf(currentPage);
                return idx > 0;
            }

            function canSwipeRight() {
                const idx = TAB_ORDER.indexOf(currentPage);
                return idx < TAB_ORDER.length - 1;
            }

            function showSwipeArrow(dir) {
                if (dir === "left") {
                    swipeLeftEl.classList.add("show");
                    swipeRightEl.classList.remove("show");
                } else {
                    swipeRightEl.classList.add("show");
                    swipeLeftEl.classList.remove("show");
                }
            }

            function hideSwipeArrows() {
                swipeLeftEl.classList.remove("show");
                swipeRightEl.classList.remove("show");
            }

            function navigateTab(delta) {
                const idx = TAB_ORDER.indexOf(currentPage);
                const newIdx = Math.max(0, Math.min(TAB_ORDER.length - 1, idx + delta));
                if (newIdx !== idx) showPage(TAB_ORDER[newIdx]);
            }

            async function bootstrap() {
                setSync("syncing", "Sync…");
                try {
                    await fetchAll();
                    setSync("", "Up to date");
                } catch (e) {
                    setSync("error", "Offline");
                    toast("Supabase error: " + (e.message || "unknown"), true);
                    return; // never back up a failed or partial load
                }

            // ============ WEEKLY BACKUP ============
            // One slot per user (supabase/007_backups.sql). The weekly backup overwrites it;
            // "Erase all my entries" never touches it.
            const WEEK_MS = 7 * 86400000;
            let backup = null; // { data, taken_at, weekly, anchor_at } or null
            let backupReady = false;

            function snapshot() {
                const { depenses, revenus, carte, cards, categories, goals, taux } = state;
                return JSON.parse(JSON.stringify({ depenses, revenus, carte, cards, categories, goals, taux }));
            }
            const entryCount = (d) => (d ? (d.depenses || []).length + (d.revenus || []).length + (d.carte || []).length : 0);

            // Due once a new 7-day slot has started since the last backup (counted from the day it was switched on)
            function backupDue() {
                if (!backup?.weekly) return false;
                const anchor = new Date(backup.anchor_at || backup.taken_at || Date.now()).getTime();
                const slot = anchor + Math.floor((Date.now() - anchor) / WEEK_MS) * WEEK_MS;
                return !backup.taken_at || new Date(backup.taken_at).getTime() < slot;
            }

            async function loadBackup() {
                const { data, error } = await sb.from("backups").select("data,taken_at,weekly,anchor_at").eq("user_id", currentUser.id);
                backupReady = !error;
                if (error) return console.warn("backups table unavailable:", error.message);
                backup = (data && data[0]) || null;
                if (!backupDue()) return;
                // an emptied account must not overwrite a backup that still holds entries
                if (entryCount(state) === 0 && entryCount(backup.data) > 0) return;
                await writeBackup({});
            }

            async function writeBackup(fields) {
                const row = {
                    user_id: currentUser.id,
                    data: snapshot(),
                    taken_at: new Date().toISOString(),
                    weekly: backup?.weekly || false,
                    anchor_at: backup?.anchor_at || null,
                    updated_at: new Date().toISOString(),
                    ...fields,
                };
                const { error } = await sb.from("backups").upsert(row);
                if (error) {
                    toast("Backup failed: " + error.message, true);
                    return false;
                }
                backup = row;
                return true;
            }

            async function toggleWeeklyBackup() {
                vibrate(35);
                if (!backupReady) return;
                const now = new Date().toISOString();
                if (!backup?.weekly) {
                    // switching on backs up right away and starts the week from today
                    if (await writeBackup({ weekly: true, anchor_at: now })) toast("Weekly backup on · backed up now");
                } else {
                    // switching off keeps the current backup
                    const { error } = await sb.from("backups").update({ weekly: false, updated_at: now }).eq("user_id", currentUser.id);
                    if (error) return toast("Could not turn it off: " + error.message, true);
                    backup.weekly = false;
                    toast("Weekly backup off · your backup is kept");
                }
                renderSettings();
            }

            const backupDateLabel = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
            const backupName = () => "Backup of the " + backupDateLabel(backup.taken_at);

            async function fetchAll() {
                // Every query is also filtered by user_id. RLS in the database is the real protection;
                // this second check means a misconfigured policy can never show someone else's rows.
                const uid = currentUser?.id;
                if (!uid) throw new Error("not signed in");
                const [depR, revR, ctR, txR, cardsR, catR, goalR, prefR, ccR] = await Promise.all([
                    sb.from("depenses").select("*").eq("user_id", uid),
                    sb.from("revenus").select("*").eq("user_id", uid),
                    sb.from("carte").select("*").eq("user_id", uid),
                    sb.from("taux").select("*").eq("user_id", uid),
                    sb.from("cards").select("*").eq("user_id", uid).order("created_at"),
                    sb.from("categories").select("*").eq("user_id", uid).order("created_at"),
                    sb.from("goals").select("*").eq("user_id", uid).order("created_at"),
                    sb.from("prefs").select("data").eq("user_id", uid),
                    sb.from("carte").select("category").eq("user_id", uid).limit(1), // probe for the 006 column
                ]);
                cardCatReady = !ccR.error;
                // prefs table (dashboard layout, theme) comes from supabase/005_card_colors_prefs.sql
                prefsReady = !prefR.error;
                if (prefR.error) console.warn("prefs table unavailable:", prefR.error.message);
                else if (prefR.data && prefR.data[0]) {
                    prefs = normalizePrefs(prefR.data[0].data);
                    try {
                        localStorage.setItem(PREFS_CACHE, JSON.stringify(prefs));
                    } catch (_) {}
                }
                applyTheme();
                // categories / goals tables come from supabase/004_categories_goals.sql
                if (catR.error) console.warn("categories table unavailable:", catR.error.message);
                if (goalR.error) console.warn("goals table unavailable:", goalR.error.message);
                state.categories = catR.error ? [] : catR.data || [];
                state.goals = goalR.error ? [] : (goalR.data || []).map((g) => ({ ...g, target: parseFloat(g.target) }));
                featuresReady = !catR.error && !goalR.error;
                if (cardsR.error) {
                    // cards table not created yet (supabase/002_cards.sql not run): fall back to the two legacy cards
                    console.warn("cards table unavailable:", cardsR.error.message);
                    const used = new Set((ctR.data || []).map((c) => c.card));
                    state.cards = [
                        { id: "techno", name: "Zitouna Technologique", style: "techno", fx: true, fx_limit: 1000 },
                        { id: "d17", name: "La Poste D17", style: "d17", fx: false, fx_limit: null },
                    ].filter((c) => used.has(c.id));
                } else {
                    state.cards = cardsR.data || [];
                }
                if (depR.error) throw depR.error;
                if (revR.error) throw revR.error;
                if (ctR.error) throw ctR.error;
                if (txR.error) throw txR.error;
                state.depenses = (depR.data || []).map((d) => ({ ...d, amount: parseFloat(d.amount) }));
                state.revenus = (revR.data || []).map((r) => ({ ...r, amount: parseFloat(r.amount) }));
                state.carte = (ctR.data || []).map((c) => ({
                    ...c,
                    usd: parseFloat(c.usd || 0),
                    eur: parseFloat(c.eur || 0),
                    rate: parseFloat(c.rate || 0),
                    total_dt: parseFloat(c.total_dt || 0),
                    card: c.card,
                }));
                if (txR.data && txR.data[0]) {
                    state.taux = {
                        usd_vente: parseFloat(txR.data[0].usd_vente),
                        eur_vente: parseFloat(txR.data[0].eur_vente),
                    };
                }
                return { dep: state.depenses.length, rev: state.revenus.length, carte: state.carte.length };
            }
